<!-- Bovino de carne visto de lado. Colores por variables CSS:
     --cw pelaje, --cf cara, --cl patas, --hu giba y papada (cebú), --pa manchas (lechero),
     --ud ubre (vaca), --ho cuernos, --mz morro, --st contorno -->
<symbol id="i-steer" viewBox="0 0 170 120">
  <ellipse cx="88" cy="112" rx="62" ry="5" fill="#000" opacity=".08"/>
  <g class="cola"><path d="M37 54C28 60 25 74 27 88" stroke="var(--cw,#8a4b2e)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="27" cy="92" rx="3.6" ry="6.4" fill="var(--ct,#3b2a20)"/></g>
  <path d="M43 78l-2 25h8l2-23zM57 80v23h8V80z" fill="var(--cl,var(--cw,#8a4b2e))"/>
  <path d="M111 80v23h8V80zM125 78l2 25h8l-3-25z" fill="var(--cl,var(--cw,#8a4b2e))"/>
  <path d="M40 100h10v4.5H40zM56 100h10v4.5H56zM110 100h10v4.5h-10zM126 100h10v4.5h-10z" fill="#2b2420"/>
  <ellipse cx="62" cy="85" rx="11" ry="6.5" fill="var(--ud,transparent)"/>
  <path d="M56 89v4M61 90v4.5M66 90v4.5M70 89v3.5" stroke="var(--ud,transparent)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M36 54c0-14 14-20 32-20l44-2c12 0 20 6 22 16l2 22c0 10-8 14-18 14H52c-10 0-18-6-18-16z" fill="var(--cw,#8a4b2e)" stroke="var(--st,rgba(0,0,0,.16))" stroke-width="1.2"/>
  <path d="M58 37c11 7 8 21-3 23-8-1-10-12-4-20zM92 49c12-4 20 6 14 18-10 4-18-4-14-18zM120 62c8 0 12 8 8 14-6 2-10-2-8-14z" fill="var(--pa,transparent)"/>
  <path d="M50 77c20 9 54 9 74 1v4c-14 6-54 6-74 0z" fill="#000" opacity=".08"/>
  <path d="M110 34c4-13 21-14 24 1-8-2-16-2-24-1z" fill="var(--hu,transparent)"/>
  <path d="M135 58c-3 14 3 27 12 26-2-8-2-17-4-26z" fill="var(--hu,transparent)"/>
  <g class="cabeza"><path d="M131 40c6-8 20-8 26 0l6 20c2 8-2 14-10 14h-4c-8-2-12-10-14-20z" fill="var(--cf,var(--cw,#8a4b2e))" stroke="var(--st,rgba(0,0,0,.16))" stroke-width="1.2"/>
  <ellipse cx="133" cy="42" rx="7.5" ry="3.4" transform="rotate(-25 133 42)" fill="var(--cw,#8a4b2e)" stroke="var(--st,rgba(0,0,0,.16))"/>
  <path d="M145 35c1-8 7-11 12-9-4 2-6 5-7 10z" fill="var(--ho,#efe6d2)"/>
  <ellipse cx="157" cy="67" rx="7.5" ry="6" fill="var(--mz,#d9a088)"/>
  <ellipse cx="160" cy="66" rx="1.4" ry="1" fill="#5a3324"/>
  <circle cx="149" cy="48" r="2.3" fill="#1d1d1d"/><circle cx="149.8" cy="47.3" r=".7" fill="#fff"/></g>
</symbol>

