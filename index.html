<script>
"use strict";
/* =====================================================================
   5. MOTOR DE CÁLCULO / CALCULATION ENGINE
   Sistema de energía neta de California (Lofgreen y Garrett, 1968) con las
   ecuaciones de NRC (1996, 2000) y NASEM (2016); proteína metabolizable
   con la síntesis microbiana de Galyean y Tedeschi (2014), adoptada por NASEM (2016).
   ===================================================================== */
const P75 = x => Math.pow(Math.max(x,0), 0.75);
const ME_TND = 0.82*4.409/100;            // EM (Mcal/kg) = 0.82 × ED; ED = 4.409 × TND/100
const MCP_A = 42.73, MCP_B = 0.087;        // PCM (g/d) = 42.73 + 0.087 × TND consumido (g/d)
const MP_MCP = 0.64, D_RUP = 0.80;         // PM = 0.64·PCM + 0.80·PNDR

/* ---------- aporte de un ingrediente (base seca) ---------- */
function tndMic(ing){ return ing.cat==='gras' ? 0 : (ing.comp.TND||0); }   // los microbios no crecen con la grasa
function valorNut(ing, k){
  const c = ing.comp;
  switch(k){
    case 'PM':   return MP_MCP*MCP_B*tndMic(ing)*10 + (c.PC||0)*10*(1-(c.PDR||0)/100)*D_RUP;
    case 'PDRb': return (c.PC||0)*10*(c.PDR||0)/100 - MCP_B*tndMic(ing)*10;
    case 'PDR':  return (c.PC||0)*(c.PDR||0)/100;
    case 'FDNef':return (c.FDN||0)*(c.pef||0);
    case 'For':  return ES_FORRAJE(ing.cat) ? 100 : 0;
    default:     return c[k]||0;
  }
}
/* término constante de la síntesis microbiana, por kg de MS, según el consumo */
function constante(k, dmi){
  if(!dmi) return 0;
  if(k==='PM') return MP_MCP*MCP_A/dmi;
  if(k==='PDRb') return -MCP_A/dmi;
  return 0;
}
const precioMS = ing => (+ing.precio||0) / Math.max((ing.comp.MS||100)/100, 0.01);

/* Aporte de una fórmula {id: % de la MS} */
function analizar(formula, ingredientes, dmi){
  const nutr = {}; let costo = 0, suma = 0, tco = 0;
  NUTRIENTES.forEach(n=>nutr[n.k]=0);
  for(const id in formula){
    const pct = +formula[id]||0; if(!pct) continue;
    const ing = ingredientes.find(i=>i.id===id); if(!ing) continue;
    suma += pct; costo += pct*precioMS(ing)/100; tco += pct/Math.max(ing.comp.MS||100,0.01);
    NUTRIENTES.forEach(n=>{ nutr[n.k] += pct*valorNut(ing,n.k)/100; });
  }
  if(suma>0) for(const k of ['PM','PDRb']) nutr[k] += constante(k,dmi)*suma/100;
  let ym = 0, ge = 0; for(const id in formula){ const pct=+formula[id]||0, ing=ingredientes.find(i=>i.id===id); if(!pct||!ing||typeof ymIng!=='function') continue; ym += pct*ymIng(ing); ge += pct; }
  nutr.Ym = ge>0 ? ym/ge : null;
  return {nutr, costoKg:costo, suma, msDieta: tco>0 ? suma/tco : 0};
}

/* ---------- el animal / the animal ---------- */
function contexto(s){
  const C = CATEGORIAS[s.cat], B = BIOTIPOS[s.biotipo], X = SEXOS[s.sexo]||SEXOS.novillo, a = s.animal, c = s.cond;
  const vaca = C.tipo==='vaca', crec = !vaca;
  const sbw = 0.96*(+a.pv||0);
  const fsbw = 0.96*(+(s.cat==='vaquillas' ? a.mw : a.pf)||1);
  const eqsbw = crec ? sbw*(+a.srw||478)/fsbw : sbw;
  const fSexo = crec ? X.fNEm : 1;
  const lact = s.cat==='lactacion';
  const a2 = 0.0007*(20-(+c.tPrev||20));            // ajuste por aclimatación térmica (NRC, 1996)
  const jadeo = c.jadeo==='abierta' ? 1.18 : c.jadeo==='rapido' ? 1.07 : 1;
  const fAct = (SISTEMAS[c.sistema]||SISTEMAS.corral).fAct;   // actividad en pastoreo (NRC, 1996: +10 a +20 %)
  const nemM = ((0.077*B.fNEm*fSexo*(lact?1.2:1)) + a2) * P75(sbw) * jadeo * fAct;
  return { s, C, B, X, vaca, crec, lact, gest: s.cat==='gestacion' || (lact && false),
    pv:+a.pv, sbw, fsbw, eqsbw, adg: crec ? (+a.adg||0) : 0, nemM, a2, jadeo, fAct,
    fIon: c.ionoforo ? 1.12 : 1,                      // ionóforo: +12 % al valor de ENm de la dieta (NRC, 1996)
    t: +a.diasGest||0, pn:+a.pn||0, leche: lact ? (+a.leche||0) : 0, grasaL:+a.grasaL||4, protL:+a.protL||3.4,
    dmiFijo: a.dmi ? +a.dmi : null };
}
/* Factores de ajuste del consumo (NRC, 1996; NASEM, 2016) */
function factoresDMI(ctx){
  const c = ctx.s.cond, f = [];
  f.push(['raza', ctx.B.fDMI||1]);
  if(ctx.crec){
    const e = ctx.eqsbw; let ebf = 1;
    if(e>350) ebf = e<=400 ? 1-(e-350)/50*0.03 : e<=450 ? 0.97-(e-400)/50*0.07 : e<=500 ? 0.90-(e-450)/50*0.08 : e<=550 ? 0.82-(e-500)/50*0.09 : 0.73;
    f.push(['grasa', ebf]);
    if(!c.implante) f.push(['implante', 0.94]);
  }
  if(c.ionoforo) f.push(['ionoforo', 0.97]);
  const t = +c.tAct; let ft = 1;
  if(t>35) ft = c.noche ? 0.90 : 0.65; else if(t>25) ft = 0.90; else if(t>=15) ft = 1; else if(t>=5) ft = 1.03; else if(t>=-5) ft = 1.05; else if(t>=-15) ft = 1.07; else ft = 1.16;
  f.push(['temperatura', ft]);
  if(+c.lodo>0) f.push(['lodo', Math.max(0.5, 1-0.01*(+c.lodo))]);
  return f;
}
function dmiPredicho(ctx, nem){
  const N = Math.max(0.8, nem||1.5), w = P75(ctx.sbw);
  let d;
  if(ctx.crec){ const k = ctx.C.dmi==='becerro' ? 0.0869 : 0.1128; d = w*(0.2435*N - 0.0466*N*N - k)/N; }
  else d = w*(0.04997*N*N + (ctx.lact ? 0.04631 : 0.03840))/N + 0.2*ctx.leche;
  return Math.max(0.5, d*factoresDMI(ctx).reduce((a,x)=>a*x[1],1));
}
/* Gestación (NRC, 1996): EM para el útero grávido y proteína del feto */
function gestacion(t, pn){
  if(t<=0) return {me:0, mp:0};
  const me = pn*(0.4504-0.000766*t)*Math.exp((0.03233-0.0000275*t)*t)/1000;
  const tp = pn*(0.001669-0.00000211*t)*Math.exp((0.0278-0.0000176*t)*t)*6.25;
  return {me:Math.max(0,me), mp:Math.max(0,tp/0.65)};
}
/* Crecimiento (NASEM, 2016): energía y proteína retenidas */
const reCrec = (eqsbw, swg) => swg>0 ? 0.0635*P75(0.891*eqsbw)*Math.pow(0.956*swg,1.097) : 0;
const swgDeRE = (eqsbw, re) => re>0 ? 13.91*Math.pow(re,0.9116)*Math.pow(eqsbw,-0.6837) : 0;
const npgCrec = (swg, re) => swg>0 ? swg*(268-29.4*re/swg) : 0;
const effPM = eqsbw => eqsbw<=300 ? 0.834-0.00114*eqsbw : 0.492;

/* Requerimientos diarios y concentraciones en la dieta para una dieta supuesta {NEm, TND} */
function requerimientos(ctx, dieta){
  const nem = dieta.NEm, me = Math.max(1, (dieta.TND||65)*ME_TND), km = Math.min(0.75, Math.max(0.45, nem/me));
  const dmi = ctx.dmiFijo || dmiPredicho(ctx, nem);
  const d = {nemM:ctx.nemM, re:0, nemP:0, nel:0, npg:0, mpM:3.8*P75(ctx.sbw), mpG:0, mpY:0, mpL:0, ca:0, p:0, km};
  d.ca = 0.0154*ctx.sbw/0.5; d.p = 0.016*ctx.sbw/0.68;
  if(ctx.crec){
    d.re = reCrec(ctx.eqsbw, ctx.adg); d.npg = npgCrec(ctx.adg, d.re);
    d.mpG = d.npg/effPM(ctx.eqsbw);
    d.ca += 0.071*d.npg/0.5; d.p += 0.039*d.npg/0.68;
  } else {
    if(ctx.s.cat==='gestacion'){ const g = gestacion(ctx.t, ctx.pn); d.nemP = g.me*km; d.mpY = g.mp; if(ctx.t>190){ d.ca += 13.7; d.p += 7.6; } }
    if(ctx.lact){ d.nel = ctx.leche*(0.3512+0.0962*ctx.grasaL); d.mpL = ctx.leche*ctx.protL*10/0.65; d.ca += 1.23*ctx.leche/0.5; d.p += 0.95*ctx.leche/0.68; }
  }
  d.mp = d.mpM+d.mpG+d.mpY+d.mpL;
  const req = {}; NUTRIENTES.forEach(n=>req[n.k]=[null,null]);
  const lim = ctx.C.lim; for(const k in lim) req[k] = lim[k].slice();
  let negReq = null, nemReq = null, sinEnergia = false;
  if(ctx.crec && ctx.adg>0){
    const fm = d.nemM/(nem*ctx.fIon);
    if(dmi - fm < 0.05*dmi){ sinEnergia = true; negReq = 9; }
    else negReq = d.re/(dmi-fm);
    req.NEg = [r3(negReq), null];
  } else {
    nemReq = (d.nemM + d.nemP + d.nel)/dmi/ctx.fIon;
    req.NEm = [r3(nemReq), null];
  }
  req.PM = [r3(d.mp/dmi), null];
  req.PDRb = [0, null];
  req.Ca = [r3(d.ca/dmi/10), null];
  req.P = [r3(d.p/dmi/10), null];
  /* azufre del agua: se descuenta del máximo de la dieta (consumo de agua ≈ 3.5–5 L por kg de MS) */
  const so4 = +ctx.s.cond.sAgua||0, litros = dmi*((+ctx.s.cond.tAct||20)>25 ? 5 : 3.5);
  d.agua = litros; d.sAgua = so4>0 ? litros*so4*(32.06/96.06)/1000/(dmi*1000)*100 : 0;
  if(req.S[1]!=null) req.S[1] = r3(Math.max(0.15, req.S[1]-d.sAgua));
  return {req, dmi, d, negReq, nemReq, sinEnergia, nemSup:nem, factores:factoresDMI(ctx)};
}
const r3 = v => Math.round(v*1000)/1000;
function cargarRequerimientos(s){
  const ctx = contexto(s), A = requerimientos(ctx, {NEm:s.animal.nemSup, TND:65});
  s.req = A.req; s.reqInfo = {dmi:A.dmi, d:A.d, nemSup:A.nemSup}; s.reqEditado = false; s.resultado = null;
}

/* ---------- predicción del desempeño con una dieta dada ---------- */
function prediccion(ctx, nutr, dmi){
  const p = {dmi};
  const nem = nutr.NEm*ctx.fIon, neg = nutr.NEg;
  const extra = requerimientos(ctx, {NEm:nutr.NEm, TND:nutr.TND}).d;
  let mpSup = nutr.PM*dmi; if(nutr.PDRb<0) mpSup += MP_MCP*nutr.PDRb*dmi;   // sin PDR suficiente, la síntesis microbiana se limita
  p.mpSup = mpSup; p.mpReq = extra.mp; p.balPM = mpSup - extra.mp;
  if(ctx.crec){
    const fm = ctx.nemM/Math.max(nem,0.1);
    p.fm = fm; p.fg = Math.max(0, dmi-fm);
    p.reDisp = p.fg*neg;
    { let lo=0, hi=4; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(reCrec(ctx.eqsbw,m) > p.reDisp) hi=m; else lo=m; } p.adgEM = lo; }   // inversa exacta de la ecuación de EN retenida
    const npgDisp = Math.max(0, (mpSup - extra.mpM))*effPM(ctx.eqsbw);
    let lo=0, hi=4; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(npgCrec(m, reCrec(ctx.eqsbw,m)) > npgDisp) hi=m; else lo=m; }
    p.adgPM = lo; p.adg = Math.min(p.adgEM, p.adgPM); p.limita = p.adgEM<=p.adgPM ? 'energia' : 'proteina';
    p.balE = (dmi-fm)*neg - extra.re;
  } else {
    p.neSup = dmi*nem; p.neReq = ctx.nemM + extra.nemP + extra.nel; p.balE = p.neSup - p.neReq; p.adg = 0;
    p.cambioPV = p.balE>0 ? p.balE/5.0 : p.balE/4.92;   // ≈ Mcal por kg de peso ganado o movilizado en vacas adultas
  }
  /* metano entérico (IPCC 2019, Nivel 2) y nitrógeno */
  const ym = nutr.Ym!=null ? nutr.Ym : (nutr.For<=10 ? 3.0 : nutr.TND>=72 ? 4.0 : nutr.TND>=62 ? 6.3 : 7.0);
  p.ym = ym; p.ch4 = dmi*18.45*ym/100/55.65*1000;          // g/d
  p.nIng = dmi*nutr.PC*10/6.25;                            // g N/d
  p.nRet = ctx.crec ? extra.npg/6.25 * (p.adg>0 && ctx.adg>0 ? Math.min(1, p.adg/ctx.adg) : 0) : (extra.mpY*0.65 + extra.mpL*0.65)/6.25;
  p.nExc = Math.max(0, p.nIng - p.nRet);
  return p;
}

/* =====================================================================
   PROGRAMACIÓN LINEAL — símplex en dos fases con regla de Bland
   ===================================================================== */
function simplex(c, filas){
  const n=c.length, m=filas.length, EPS=1e-9;
  const R_ = filas.map(f=>{
    let a=f.a.slice(), b=f.b, op=f.op, sg=1;
    if(b<0){ a=a.map(v=>-v); b=-b; op = op==='>='?'<=':(op==='<='?'>=':'='); sg=-1; }
    return {a,b,op,sg};
  });
  let nS=0,nA=0; const colH=[], colA=[];
  R_.forEach((r,i)=>{ colH[i] = r.op!=='=' ? n+(nS++) : -1; });
  R_.forEach((r,i)=>{ colA[i] = r.op!=='<=' ? -2 : -1; });
  R_.forEach((r,i)=>{ if(colA[i]===-2) colA[i] = n+nS+(nA++); });
  const N = n+nS+nA;
  const T_ = R_.map((r,i)=>{
    const row = new Float64Array(N+1);
    for(let j=0;j<n;j++) row[j]=r.a[j];
    if(colH[i]>=0) row[colH[i]] = r.op==='<=' ? 1 : -1;
    if(colA[i]>=0) row[colA[i]] = 1;
    row[N]=r.b; return row;
  });
  const basis = R_.map((r,i)=> r.op==='<=' ? colH[i] : colA[i]);
  const esArt = j => j>=n+nS;
  let PIV=0;
  function pivot(pr,pc){
    PIV++;
    const P=T_[pr], p=P[pc];
    for(let j=0;j<=N;j++) P[j]/=p;
    for(let i=0;i<m;i++){ if(i===pr) continue; const f=T_[i][pc]; if(Math.abs(f)>1e-12){ const Ti=T_[i]; for(let j=0;j<=N;j++) Ti[j]-=f*P[j]; } }
    basis[pr]=pc;
  }
  function reducido(cost,j){ let d=cost[j]; for(let i=0;i<m;i++) d-=cost[basis[i]]*T_[i][j]; return d; }
  function correr(cost, permitirArt){
    for(let it=0; it<50000; it++){
      const enB = new Set(basis); let ent=-1;
      for(let j=0;j<N;j++){ if(enB.has(j)) continue; if(!permitirArt && esArt(j)) continue; if(reducido(cost,j) < -EPS){ ent=j; break; } }
      if(ent<0) return 'optimo';
      let sal=-1, mejor=Infinity;
      for(let i=0;i<m;i++){ const a=T_[i][ent]; if(a>EPS){ const q=T_[i][N]/a; if(q<mejor-1e-12 || (Math.abs(q-mejor)<=1e-12 && basis[i]<basis[sal])){ mejor=q; sal=i; } } }
      if(sal<0) return 'no acotado';
      pivot(sal,ent);
    }
    return 'iteraciones';
  }
  const c1 = new Float64Array(N); for(let j=n+nS;j<N;j++) c1[j]=1;
  let st = correr(c1, true);
  let inf = 0; for(let i=0;i<m;i++) if(esArt(basis[i])) inf += T_[i][N];
  if(inf > 1e-7) return {estado:'infactible'};
  for(let i=0;i<m;i++) if(esArt(basis[i])){ for(let j=0;j<n+nS;j++){ if(Math.abs(T_[i][j])>1e-9){ pivot(i,j); break; } } }
  const c2 = new Float64Array(N); for(let j=0;j<n;j++) c2[j]=c[j];
  st = correr(c2, false);
  if(st!=='optimo') return {estado:st};
  const x = new Array(n).fill(0);
  for(let i=0;i<m;i++) if(basis[i]<n) x[basis[i]] = T_[i][N];
  const z = x.reduce((s,v,j)=>s+v*c[j],0);
  const duales = R_.map((r,i)=>{
    let y;
    if(r.op==='<=') y = -reducido(c2,colH[i]);
    else if(r.op==='>=') y = reducido(c2,colH[i]);
    else y = -reducido(c2,colA[i]);
    return y*r.sg;
  });
  const reducidos = []; for(let j=0;j<n;j++) reducidos[j]=reducido(c2,j);
  return {estado:'optimo', x, z, duales, reducidos, piv:PIV};
}
/* Certificado de optimalidad por dualidad fuerte */
function certificado(c, filas, x, y){
  let viol = 0;
  filas.forEach(f=>{ const l = f.a.reduce((s,v,j)=>s+v*x[j],0);
    if(f.op==='>=') viol = Math.max(viol, f.b-l); else if(f.op==='<=') viol = Math.max(viol, l-f.b); else viol = Math.max(viol, Math.abs(l-f.b)); });
  viol = Math.max(viol, ...x.map(v=>-v), 0);
  let dualViol = 0;
  filas.forEach((f,i)=>{ if(f.op==='>=') dualViol=Math.max(dualViol,-y[i]); if(f.op==='<=') dualViol=Math.max(dualViol,y[i]); });
  for(let j=0;j<c.length;j++){ let d=c[j]; filas.forEach((f,i)=>{ d-=y[i]*f.a[j]; }); dualViol=Math.max(dualViol,-d); }
  const zP = x.reduce((s,v,j)=>s+v*c[j],0), zD = filas.reduce((s,f,i)=>s+y[i]*f.b,0);
  const brecha = Math.abs(zP-zD)/Math.max(1,Math.abs(zP));
  return {viol, dualViol, brecha, ok: viol<1e-6 && dualViol<1e-6 && brecha<1e-7};
}
/* Modelo: variables = % de cada ingrediente en la MS; objetivo = costo por kg de MS */
function construirModelo(ings, req, dmi, omitir){
  const filas = [];
  const add = (tag, etiqueta, a, op, b, meta)=>{
    if(omitir && omitir===tag) return;
    const e = Math.max(1e-9, ...a.map(Math.abs));
    filas.push({tag, etiqueta, a:a.map(v=>v/e), op, b:b/e, esc:e, ...meta});
  };
  add('suma',T('Suma de ingredientes = 100 % de la MS','Sum of ingredients = 100 % of DM'), ings.map(()=>1), '=', 100, {tipo:'suma'});
  NUTRIENTES.forEach(nu=>{
    const r = req[nu.k]; if(!r) return;
    const a = ings.map(i=>valorNut(i,nu.k)), k0 = constante(nu.k, dmi);
    if(r[0]!=null && r[0]!=='') add('nmin_'+nu.k, tx(nu.n)+' ≥ '+r[0], a, '>=', 100*(r[0]-k0), {tipo:'nut', k:nu.k, lado:'min', req:r[0]});
    if(r[1]!=null && r[1]!=='') add('nmax_'+nu.k, tx(nu.n)+' ≤ '+r[1], a, '<=', 100*(r[1]-k0), {tipo:'nut', k:nu.k, lado:'max', req:r[1]});
  });
  ings.forEach((ing,j)=>{
    const e = ings.map((_,q)=>q===j?1:0);
    if(ing.min>0) add('imin_'+ing.id, tx(ing.nombre)+' ≥ '+ing.min+' %', e, '>=', ing.min, {tipo:'ing', id:ing.id, lado:'min'});
    if(ing.max!=null && ing.max!=='' && ing.max<100) add('imax_'+ing.id, tx(ing.nombre)+' ≤ '+ing.max+' %', e, '<=', ing.max, {tipo:'ing', id:ing.id, lado:'max'});
  });
  return {ings, filas, c:ings.map(i=>precioMS(i)+(i.penal||0)), req, dmi};
}
function resolverModelo(M){
  if(!M.ings.length) return {ok:false, motivo:T('No hay ingredientes seleccionados.','No ingredients selected.')};
  const sol = simplex(M.c, M.filas);
  if(sol.estado!=='optimo'){
    return {ok:false, motivo: sol.estado==='infactible' ? T('No existe ninguna combinación de los ingredientes seleccionados que cumpla todas las restricciones.','No combination of the selected ingredients meets all the constraints.') : T('El cálculo no convergió (','The calculation did not converge (')+sol.estado+').',
      diagnostico: sol.estado==='infactible' ? diagnosticar(M) : null};
  }
  const pct = sol.x.map(v=> Math.abs(v)<1e-7 ? 0 : v);
  const formula = Object.fromEntries(M.ings.map((ing,j)=>[ing.id,pct[j]]));
  const an = analizar(formula, M.ings, M.dmi);
  const restr = M.filas.map((f,i)=>{
    const lhs = f.a.reduce((acc,v,j)=>acc+v*pct[j],0);
    const activa = Math.abs(lhs - f.b) < 1e-6*Math.max(1,Math.abs(f.b));
    return {tag:f.tag, etiqueta:f.etiqueta, tipo:f.tipo, k:f.k, id:f.id, lado:f.lado, req:f.req, activa, dual: sol.duales[i]/f.esc};
  });
  return { ok:true, fecha:new Date().toISOString(),
    formula: M.ings.map((ing,j)=>({id:ing.id, nombre:ing.nombre, cat:ing.cat, pct:pct[j], ms:ing.comp.MS, pctTCO: an.msDieta*pct[j]/Math.max(ing.comp.MS,0.01), precio:+ing.precio, precioMS:precioMS(ing), reducido: sol.reducidos[j]})),
    costoKg: an.costoKg, costoKgTCO: an.costoKg*an.msDieta/100, costoObjetivo: sol.z/100, msDieta: an.msDieta, nutr: an.nutr, restr, cert: certificado(M.c, M.filas, sol.x, sol.duales),
    modelo: {n:M.ings.length, m:M.filas.length, piv:sol.piv} };
}
function diagnosticar(M){
  const culpables = [];
  const tags = [...new Set(M.filas.map(f=>f.tag))].filter(t=>t!=='suma');
  tags.forEach(t=>{
    const M2 = construirModelo(M.ings, M.req, M.dmi, t);
    if(simplex(M2.c, M2.filas).estado==='optimo') culpables.push(M.filas.find(f=>f.tag===t).etiqueta);
  });
  const sinFuente = [];
  NUTRIENTES.forEach(nu=>{ const r = M.req[nu.k]; if(!r || r[0]==null || r[0]<=0 || nu.k==='PDRb') return;
    if(!M.ings.some(i=>valorNut(i,nu.k)>0)) sinFuente.push(tx(nu.n)); });
  return {culpables, sinFuente};
}

/* ---------- formulación con ajuste iterativo de la energía y el consumo ----------
   El requerimiento de ENg por kg de MS depende de la ENm de la propia dieta (el alimento
   que se gasta en mantenimiento) y el consumo depende también de la ENm. Se resuelve el
   modelo lineal, se actualiza la ENm supuesta con la de la dieta obtenida y se repite
   hasta que el cambio es menor que 0.002 Mcal/kg (punto fijo amortiguado). */
function formularContexto(ctx, ings, reqFijo, opciones){
  opciones = opciones||{};
  const iter = [];
  if(reqFijo){
    const dmi = reqFijo.dmi;
    const r = resolverModelo(construirModelo(ings, reqFijo.req, dmi));
    r.iter = iter; r.dmi = dmi; r.animal = {dmi, d:reqFijo.d, editado:true};
    if(r.ok) r.pred = prediccion(ctx, r.nutr, dmi);
    return r;
  }
  /* Punto fijo «ENm supuesta = ENm de la ración» (f = ENm dieta − ENm supuesta = 0). Primero pasos
     directos amortiguados; si no convergen, se recorre una malla de ENm supuestas (0.8–2.9 Mcal/kg),
     se toma el primer par de raciones factibles con cambio de signo (f ≥ 0 → f < 0) y se biseca entre
     ellas. Se conserva la del lado conservador (f ≥ 0): su ENm real es al menos la supuesta, así que
     cumple el requerimiento verdadero. Sin cambio de signo, se usa la factible con f ≥ 0 más cercana
     a cero o, si no hay, la de f mayor. */
  let tnd = 70, conv = false, it = 0, cand = null, ultimo = null;
  const pts = [];
  const evalua = g => { it++; const A = requerimientos(ctx, {NEm:g, TND:tnd}); if(opciones.ajustarReq) opciones.ajustarReq(A.req);
    const r = resolverModelo(construirModelo(ings, A.req, A.dmi));
    iter.push({it, nem:g, dmi:A.dmi, neg:A.negReq, nemReq:A.nemReq, costo:r.ok?r.costoKg:null, nemDieta:r.ok?r.nutr.NEm:null});
    if(r.ok) tnd = r.nutr.TND; const o = {g, r, A, f: r.ok ? r.nutr.NEm - g : null}; ultimo = o; pts.push(o); return o; };
  let g = Math.min(2.6, Math.max(0.9, opciones.nem0 || 1.9)), o = evalua(g);
  for(let k=0; k<6 && o.r.ok && Math.abs(o.f) >= 0.002; k++){ g = Math.min(2.9, Math.max(0.8, g + 0.85*o.f)); o = evalua(g); }
  if(o.r.ok && Math.abs(o.f) < 0.002){ conv = true; cand = o; }
  else {
    for(let gg=0.8; gg<=2.9001; gg+=0.1) evalua(+gg.toFixed(2));
    const ok = pts.filter(p=>p.r.ok).sort((a,b)=>a.g-b.g);
    let par = null;
    for(let k=0; k+1<ok.length && !par; k++) if(ok[k].f >= 0 && ok[k+1].f < 0) par = [ok[k], ok[k+1]];
    if(par){ let [lo, hi] = par;
      for(let k=0; k<30 && hi.g-lo.g > 0.0005; k++){ const q = evalua((lo.g+hi.g)/2);
        if(q.r.ok && q.f < 0) hi = q; else if(q.r.ok) lo = q; else lo = {...lo, g:q.g}; }
      cand = lo; conv = true;
    } else {
      const pos = ok.filter(p=>p.f >= 0).sort((a,b)=>a.f-b.f)[0];
      cand = pos || ok.sort((a,b)=>b.f-a.f)[0] || null;
    }
  }
  const fin = cand || ultimo;
  const r = fin.r, A = fin.A;
  r.iter = iter; r.convergio = conv; r.animal = {dmi:A.dmi, d:A.d, negReq:A.negReq, nemReq:A.nemReq, sinEnergia:A.sinEnergia, factores:A.factores, req:A.req};
  r.dmi = A.dmi;
  if(r.ok) r.pred = prediccion(ctx, r.nutr, A.dmi);
  return r;
}
function formular(s){
  const ctx = contexto(s);
  const ings = s.ingredientes.filter(i=>s.sel[i.id]);
  const r = formularContexto(ctx, ings, s.reqEditado ? {req:s.req, dmi:s.reqInfo.dmi, d:s.reqInfo.d} : null, {nem0:s.animal.nemSup});
  r.contexto = {cat:s.cat, biotipo:s.biotipo, sexo:s.sexo, pv:s.animal.pv, adg:ctx.adg, req: JSON.parse(JSON.stringify(r.animal.req||s.req)), editado:s.reqEditado};
  return r;
}

/* Ganancia máxima alcanzable con los ingredientes y límites actuales (bisección sobre la meta) */
function gananciaMaxima(s){
  const ings = s.ingredientes.filter(i=>s.sel[i.id]);
  const prueba = g => { const s2 = JSON.parse(JSON.stringify(s)); s2.animal.adg = g; return formularContexto(contexto(s2), ings, null, {nem0:s.animal.nemSup}).ok; };
  if(!prueba(0.1)) return 0;
  let lo = 0.1, hi = Math.max(0.2, +s.animal.adg||1.5);
  for(let i=0;i<14;i++){ const m = (lo+hi)/2; if(prueba(m)) lo = m; else hi = m; }
  return lo;
}

/* ---------- programa de alimentación / feeding program ---------- */
function fasesPrograma(s){
  const a = s.animal, v = Math.max(+a.pv+60, +(s.prog&&s.prog.venta) || (s.cat==='engorda'?Math.max(+a.pv+100,520):s.cat==='desarrollo'?Math.max(+a.pv+80,320):Math.round(0.62*a.mw)));
  if(s.cat==='engorda'){
    const p0 = +a.pv, m1 = Math.min(p0+45, v-40), m2 = Math.round((m1+v)/2);
    return [ {id:'rec', n:{es:'Recepción y adaptación',en:'Receiving and step-up'}, hasta:m1, adg:1.1, For:[30,45]},
             {id:'cre', n:{es:'Crecimiento',en:'Growing'}, hasta:m2, adg:1.35, For:[15,25]},
             {id:'fin', n:{es:'Finalización',en:'Finishing'}, hasta:v, adg:1.45, For:[8,12]} ];
  }
  if(s.cat==='desarrollo') return [ {id:'d1', n:{es:'Desarrollo I',en:'Growing I'}, hasta:Math.round((+a.pv+v)/2), adg:0.85, For:[40,60]},
                                    {id:'d2', n:{es:'Desarrollo II',en:'Growing II'}, hasta:v, adg:1.0, For:[35,50]} ];
  if(s.cat==='vaquillas') return [ {id:'v1', n:{es:'Desarrollo al empadre',en:'Growth to breeding'}, hasta:v, adg:0.6, For:[40,70]} ];
  const pico = +a.leche || BIOTIPOS[s.biotipo].leche;
  return [ {id:'gm', n:{es:'Gestación media',en:'Mid gestation'}, dias:95, cat:'gestacion', t:150, leche:0},
           {id:'gf', n:{es:'Gestación final',en:'Late gestation'}, dias:90, cat:'gestacion', t:240, leche:0},
           {id:'lt', n:{es:'Lactación temprana',en:'Early lactation'}, dias:90, cat:'lactacion', t:0, leche:pico},
           {id:'la', n:{es:'Lactación tardía',en:'Late lactation'}, dias:90, cat:'lactacion', t:0, leche:+(pico*0.6).toFixed(1)} ];
}
function formularPrograma(s){
  const ings = s.ingredientes.filter(i=>s.sel[i.id]);
  const fases = (s.prog && s.prog.fases) || fasesPrograma(s);
  const crec = CATEGORIAS[s.cat].tipo==='crec';
  const out = {fecha:new Date().toISOString(), cat:s.cat, crec, fases:[], curva:[], ok:true};
  if(crec){
    let W = +s.animal.pv, dia = 0, cms = 0, costo = 0, ch4 = 0;
    out.curva.push([0,W]);
    fases.forEach((f,fi)=>{
      const desde = W, medio = (W + f.hasta)/2;
      const s2 = JSON.parse(JSON.stringify(s)); s2.animal.pv = medio; s2.animal.adg = f.adg; s2.animal.dmi = null;
      const ctx = contexto(s2);
      const ajuste = req=>{ req.For = f.For.slice(); if(fi===0 && s.cat==='engorda'){ req.FDNef=[Math.max(req.FDNef[0]||0,12),null]; } };
      let r = formularContexto(ctx, ings, null, {nem0:s.animal.nemSup, ajustarReq:ajuste}), adgUsada = f.adg;
      if(!r.ok){   /* meta inalcanzable: se usa la ganancia máxima posible de esa fase */
        const ok = g => { const s3 = JSON.parse(JSON.stringify(s2)); s3.animal.adg = g; return formularContexto(contexto(s3), ings, null, {nem0:s.animal.nemSup, ajustarReq:ajuste}); };
        let lo = 0, hi = f.adg, mejor = null; for(let i=0;i<12;i++){ const m=(lo+hi)/2; const rr = ok(m); if(rr.ok){ lo=m; mejor=rr; } else hi=m; }
        if(mejor){ r = mejor; adgUsada = lo; }
      }
      const fase = {f, r, desde, dias:0, cms:0, costo:0, ganancia:0, adgMeta:adgUsada, ajustada: adgUsada<f.adg-0.01};
      if(!r.ok){ out.ok=false; out.fases.push(fase); return; }
      let guard = 0;
      while(W < f.hasta && guard < 900){
        const s3 = JSON.parse(JSON.stringify(s2)); s3.animal.pv = W; const c3 = contexto(s3);
        const dmi = dmiPredicho(c3, r.nutr.NEm);
        const nutr = Object.assign({}, r.nutr, {PM: r.nutr.PM - constante('PM',r.dmi) + constante('PM',dmi), PDRb: r.nutr.PDRb - constante('PDRb',r.dmi) + constante('PDRb',dmi)});
        const p = prediccion(c3, nutr, dmi);
        const g = Math.max(p.adg, 0.05);
        W += g; dia++; fase.dias++; fase.cms += dmi; fase.costo += dmi*r.costoKg; ch4 += p.ch4;
        if(dia%7===0) out.curva.push([dia, W]);
        guard++;
      }
      fase.ganancia = W-desde; fase.hasta = W; cms += fase.cms; costo += fase.costo;
      out.curva.push([dia, W]); out.fases.push(fase);
    });
    Object.assign(out, {dias:dia, pvI:+s.animal.pv, pvF:W, cms, costo, ch4});
  } else {
    let dias=0, cms=0, costo=0, ch4=0;
    fases.forEach(f=>{
      const s2 = JSON.parse(JSON.stringify(s)); s2.cat = f.cat; s2.animal.diasGest = f.t; s2.animal.leche = f.leche; s2.animal.dmi = null;
      const ctx = contexto(s2);
      const r = formularContexto(ctx, ings, null, {nem0:s.animal.nemSup});
      const fase = {f, r, dias:f.dias, cms:0, costo:0};
      if(r.ok){ fase.cms = r.dmi*f.dias; fase.costo = fase.cms*r.costoKg; cms += fase.cms; costo += fase.costo; dias += f.dias; ch4 += r.pred.ch4*f.dias; } else out.ok=false;
      out.fases.push(fase);
    });
    Object.assign(out, {dias, cms, costo, ch4});
  }
  return out;
}

/* ---------- energía neta observada (Zinn y Shen, 1998) ----------
   A partir del desempeño observado se despeja la ENm de la dieta con
   CMS = EM/ENm + EG/ENg y ENg = 0.877·ENm − 0.41 (Zinn et al., 2008). */
function eneObservada(pvI, pvF, adg, dmi, em, eg){
  const W = P75((pvI+pvF)/2), EM = (em||0.077)*W, EG = (eg||0.0557)*W*Math.pow(adg,1.097);
  const a = -0.41*EM, b = 0.877*EM + 0.41*dmi + EG, c = -0.877*dmi;
  const disc = b*b - 4*a*c;
  const nem = (-b - Math.sqrt(disc))/(2*c);
  return {nem, neg: 0.877*nem - 0.41, EM, EG};
}

function tarjetasReq(info, ctx){
  const d = info.d, dmi = info.dmi, crec = ctx.crec;
  const t = [
    [T('Consumo de MS esperado','Expected DM intake'), fmt(dmi,2)+' kg/d', fmt(100*dmi/ctx.pv,2)+' % '+T('del peso vivo','of body weight'), 'dmi'],
    [T('ENm de mantenimiento','NEm for maintenance'), fmt(d.nemM,2)+' Mcal/d', T('mantener el peso','keep weight'), 'NEm'],
    crec ? [T('Energía retenida (ENg)','Retained energy (NEg)'), fmt(d.re,2)+' Mcal/d', fmt(ctx.adg,2)+' kg/d '+T('de ganancia','of gain'), 'NEg']
         : [T('Gestación + leche','Pregnancy + milk'), fmt(d.nemP+d.nel,2)+' Mcal/d', T('ENm equivalente','NEm equivalent'), 'leche'],
    [T('Proteína metabolizable','Metabolizable protein'), fmt(d.mp,0)+' g/d', crec?T(`${fmt(d.mpM,0)} mant. + ${fmt(d.mpG,0)} crec.`,`${fmt(d.mpM,0)} maint. + ${fmt(d.mpG,0)} growth`):T(`${fmt(d.mpM,0)} mant. + ${fmt(d.mpY+d.mpL,0)} prod.`,`${fmt(d.mpM,0)} maint. + ${fmt(d.mpY+d.mpL,0)} prod.`), 'PM'],
    [T('Calcio · fósforo','Calcium · phosphorus'), fmt(d.ca,1)+' · '+fmt(d.p,1)+' g/d', T('absorción 50 % y 68 %','50 % and 68 % absorption'), 'Ca']
  ];
  if(crec) t.push([T('Peso equivalente','Equivalent weight'), fmt(ctx.eqsbw,0)+' kg', T('SRW ','SRW ')+(S.animal.srw||478)+' kg', 'eqsbw']);
  return `<div class="req-d">${t.map(x=>`<div class="${x[3]==='eqsbw'?'sci':''}"><div class="l">${x[0]}${ayuda(x[3])}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('')}</div>`;
}

  const filas = NUTRIENTES.map(nu=>{
    const r = S.req[nu.k]||[null,null];
    return `<tr class="${KEYN.includes(nu.k)?'':'sci'}"><td>${esc(tx(nu.n))}${ayuda(nu.k)}</td><td class="muted">${nu.u}</td>
      <td class="r"><input class="num" data-req="${nu.k}" data-l="0" value="${r[0]??''}" placeholder="—" aria-label="min ${esc(tx(nu.n))}"></td>

    <div class="grid g4 sci">
      <label class="f">kg CO₂e<input data-env="co2" value="${(ing.env||envDe(ing.id)).co2}" inputmode="decimal"></label>
      <label class="f">${T('Agua (L)','Water (L)')}<input data-env="agua" value="${(ing.env||envDe(ing.id)).agua}" inputmode="decimal"></label>
      <label class="f">${T('Suelo (m²·año)','Land (m²·yr)')}<input data-env="suelo" value="${(ing.env||envDe(ing.id)).suelo}" inputmode="decimal"></label>
    </div>
    <p class="small muted">${T('Las categorías de forraje y ensilaje cuentan como forraje en la dieta. La grasa no aporta energía a los microbios del rumen.','Forage and silage categories count as dietary forage. Fat supplies no energy to rumen microbes.')}</p>`;
  $$('[data-env]',box).forEach(i=>i.addEventListener('change',()=>{ ing.env = ing.env||envDe(ing.id); ing.env[i.dataset.env]=num(i.value)||0; guardar(); }));
  $$('[data-comp]',box).forEach(i=>i.addEventListener('change',()=>{ ing.comp[i.dataset.comp]=num(i.value)||0; S.resultado=null; guardar(); }));
  $$('[data-campo]',box).forEach(i=>i.addEventListener('change',()=>{ ing[i.dataset.campo]=i.value; guardar(); render(); }));
  $('#cerrarDet').addEventListener('click',()=>{ ingDetalle=null; pintarDetalle(); });
  const bb = $('#borrarIng'); if(bb) bb.addEventListener('click',()=>{ S.ingredientes=S.ingredientes.filter(i=>i.id!==ing.id); delete S.sel[ing.id]; ingDetalle=null; guardar(); render(); });
  const rb = $('#resetIng'); if(rb) rb.addEventListener('click',()=>{ const n=ingDesdeLib(ING_LIB.find(x=>x[0]===ing.id)); ing.comp=n.comp; ing.nombre=n.nombre; ing.cat=n.cat; guardar(); render(); });
}

/* ================= BLOQUE 5 · PRECIOS ================= */
function renderPrecios(el){
  const sel = S.ingredientes.filter(i=>S.sel[i.id]);
  el.innerHTML = `${cabecera('precios',T('Escribe el precio que pagas por kg puesto en el rancho, tal como lo compras. La app lo convierte a precio por kg de materia seca, que es lo que se compara y se minimiza. Los precios precargados son solo ejemplos.','Enter the price you pay per kg delivered to the ranch, as you buy it. The app converts it to price per kg of dry matter, which is what gets compared and minimized. Preloaded prices are only examples.'))}
  ${teoriaDe(['limites'])}
  ${sel.length?'':`<div class="empty">${ill('i-sack')}<p>${T('No hay ingredientes seleccionados. Regresa al Bloque 5.','No ingredients selected. Go back to Block 5.')}</p></div>`}
  <div class="card">
    <div class="row between" style="margin-bottom:10px"><h3 style="margin:0">${T('Precios y límites','Prices and limits')} · ${sel.length} ${T('ingredientes','ingredients')}</h3><span class="small muted">${T('Límites en % de la materia seca','Limits in % of dry matter')}</span></div>
    <div class="tbl"><table>
      <thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">${esc(S.moneda)}/kg ${T('TCO','AF')}${ayuda('precio')}</th><th class="r">${esc(S.moneda)}/kg MS${ayuda('precioMS')}</th><th class="r">${T('Mínimo','Minimum')} %${ayuda('incl')}</th><th class="r">${T('Máximo','Maximum')} %</th><th class="r">${esc(S.moneda)} ${T('por Mcal ENg','per Mcal NEg')}${ayuda('pMcal')}</th><th class="r">${esc(S.moneda)} ${T('por kg PC','per kg CP')}${ayuda('ppc')}</th></tr></thead>
      <tbody>${sel.map(i=>`<tr>
        <td>${esc(tx(i.nombre))}</td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="precio" value="${i.precio}"></td>
        <td class="r muted" data-pms="${i.id}">${fmt(precioMS(i),2)}</td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="min" value="${i.min??0}"></td>
        <td class="r"><input class="num" data-pr="${i.id}" data-f="max" value="${i.max??''}"></td>
        <td class="r muted">${i.comp.NEg>0?fmt(precioMS(i)/i.comp.NEg,2):'—'}</td>
        <td class="r muted">${i.comp.PC>0?fmt(precioMS(i)/(i.comp.PC/100),2):'—'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">${T('TCO = tal como se ofrece (húmedo). Para fijar una inclusión exacta (p. ej. premezcla 0.3 %) escribe el mismo valor en mínimo y máximo.','AF = as fed (wet). To fix an exact inclusion (e.g. premix 0.3 %) enter the same value as minimum and maximum.')}</p>
  </div>
  ${siguiente('precios')}`;
  $$('[data-pr]',el).forEach(inp=>inp.addEventListener('change',()=>{
    const ing = S.ingredientes.find(i=>i.id===inp.dataset.pr); const v = num(inp.value);
    ing[inp.dataset.f] = inp.dataset.f==='max' ? v : (v||0);
    if(inp.dataset.f==='precio'){ const td=$(`[data-pms="${ing.id}"]`); if(td) td.textContent=fmt(precioMS(ing),2); }
    S.resultado=null; S.programa=null; guardar();
  }));
}

</script>
<script>
"use strict";
/* ================= BLOQUE 2 · REGIÓN, CLIMA E INFRAESTRUCTURA ================= */
function mapaSVG(sel, edoSel, chico){
  const W = MAPA_MX.w, H = MAPA_MX.h;
  return `<svg class="mapa${chico?' chico':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Mapa de México por regiones ganaderas','Map of Mexico by cattle region')}">
    ${Object.entries(MAPA_MX.edo).map(([k,d])=>{ const rg = REGION_DE_EDO[k], R = REGIONES[rg]||{color:'#ccc'};
      return `<path d="${d}" data-edo="${k}" class="edo ${rg===sel?'sel':''} ${k===edoSel?'edosel':''}" style="--rc:${R.color}"><title>${esc(NOMBRE_EDO[k]||k)} · ${esc(tx((REGIONES[rg]||{n:''}).n))}</title></path>`; }).join('')}
    ${chico?'':Object.entries(REGIONES).map(([k,R])=>{ const cs = R.edos.map(e=>MAPA_MX.cen[e]).filter(Boolean); const x = cs.reduce((a,c)=>a+c[0],0)/cs.length, y = cs.reduce((a,c)=>a+c[1],0)/cs.length;
      return `<g class="etq ${k===sel?'sel':''}" pointer-events="none"><text x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle">${esc(tx(R.n))}</text></g>`; }).join('')}
  </svg>`;
}
function barraITH(ith, ef){
  const X = v => Math.max(0, Math.min(100, (v-60)/(90-60)*100));
  return `<div class="ith"><div class="tramos"><i style="left:0;width:${X(75)}%" class="ok"></i><i style="left:${X(75)}%;width:${X(79)-X(75)}%" class="info"></i><i style="left:${X(79)}%;width:${X(84)-X(79)}%" class="warn"></i><i style="left:${X(84)}%;width:${100-X(84)}%" class="bad"></i></div>
    <b class="m med" style="left:${X(ith)}%" title="${T('ITH medio','Mean THI')}"></b><b class="m efe" style="left:${X(ef)}%" title="${T('ITH efectivo','Effective THI')}"></b>
    <div class="esc"><span>60</span><span style="left:${X(75)}%">75</span><span style="left:${X(79)}%">79</span><span style="left:${X(84)}%">84</span><span style="right:0">90</span></div></div>`;
}
function renderRegion(el){
  const R = REGIONES[S.region], c = S.cond, cat = CAT_ITH(c.ithEf);
  const filasT = Object.entries(TEMPORADAS).map(([k,n])=>{ const t = R.t[k], v = ITH(t[0],t[2]), cc = CAT_ITH(v);
    return `<tr class="${k===S.temporada?'tot':''}"><td>${esc(tx(n))}</td><td class="r">${t[0]}</td><td class="r">${t[1]}</td><td class="r">${t[2]}</td><td class="r"><span class="badge ${cc[0]}">${fmt(v,1)} · ${esc(tx(cc[1]))}</span></td></tr>`; }).join('');
  const sel = (id, obj, val) => `<select id="${id}">${Object.entries(obj).map(([k,o])=>`<option value="${k}" ${k===val?'selected':''}>${esc(tx(o.n))}</option>`).join('')}</select>`;
  el.innerHTML = `${cabecera('region',T('No es lo mismo formular en Sonora que en Querétaro o en Veracruz. Elige tu estado en el mapa: RatioBos carga el clima de la temporada, calcula el índice de temperatura y humedad (ITH), ajusta los precios a tu región y te dice qué cambia por la infraestructura de tus corrales.','Formulating in Sonora is not the same as in Querétaro or Veracruz. Pick your state on the map: RatioBos loads the season’s climate, computes the temperature–humidity index (THI), adjusts prices to your region and shows what changes with your pen infrastructure.'))}
  ${teoriaDe(['region','ith','infra','regional'])}
  <div class="card"><div class="mapa-wrap">
    <div>${mapaSVG(S.region, S.edo)}
      <div class="chips" style="margin-top:8px">${Object.entries(REGIONES).map(([k,r])=>`<button class="chip rchip ${k===S.region?'on':''}" data-reg="${k}" style="--rc:${r.color}"><i></i>${esc(tx(r.n))}</button>`).join('')}</div></div>
    <div class="rinfo">
      <div class="eyebrow">${S.edo?esc(NOMBRE_EDO[S.edo]):''}</div>
      <h2 style="margin:4px 0 2px">${esc(tx(R.n))}</h2><p class="muted small" style="margin:0 0 10px">${esc(R.ref)}</p>
      <dl>
        <dt>${T('Clima','Climate')}</dt><dd>${esc(tx(R.clima))}</dd>
        <dt>${T('Suelos y agua','Soils and water')}</dt><dd>${esc(tx(R.suelo))}</dd>
        <dt>${T('Razas comunes','Common breeds')}</dt><dd>${esc(tx(R.razas))}</dd>
        <dt>${T('Sistemas de producción','Production systems')}</dt><dd>${esc(tx(R.sistema))}</dd>
        <dt>${T('Insumos de la región','Regional feedstuffs')}</dt><dd>${esc(tx(R.insumos))}</dd>
        <dt>${T('Retos','Challenges')}</dt><dd>${esc(tx(R.retos))}</dd>
      </dl>
      <div class="row"><button class="btn sm" id="aplPrecios">${T('Usar precios de esta región','Use this region’s prices')}</button><button class="btn ghost sm" id="aplIngr">${T('Seleccionar sus ingredientes típicos','Select its typical ingredients')}</button></div>
      <p class="tiny muted">${T('Precios: ejemplo de octubre de 2026 × factor regional estimado (producción local, flete, frontera o puerto). Captura tus cotizaciones en el Bloque 6.','Prices: October 2026 example × estimated regional factor (local production, freight, border or port). Enter your quotes in Block 6.')}</p>
    </div></div></div>

  ${tarjetaEstudios(S.region)}
  <div class="card"><div class="row between"><h3 style="margin:0">${T('Temporada y estrés por calor','Season and heat stress')}${ayuda('ith')}</h3>
    <div class="basesw" role="group">${Object.entries(TEMPORADAS).map(([k,n])=>`<button data-temp="${k}" class="${k===S.temporada?'on':''}">${esc(tx(n)).replace(/\s*\(.*\)/,'')}</button>`).join('')}</div></div>
    <div class="grid g2" style="margin-top:12px">
      <div><div class="kpis" style="margin:0 0 10px"><div class="kpi"><div class="l">${T('ITH medio','Mean THI')}</div><div class="v">${fmt(c.ith,1)}</div><div class="s">${fmt(c.tAct,0)} °C · ${fmt(c.hr,0)} % HR</div></div>
        <div class="kpi"><div class="l">${T('ITH efectivo','Effective THI')}</div><div class="v" style="color:var(--${cat[0]==='ok'?'ok':cat[0]==='info'?'info':cat[0]==='warn'?'warn':'bad'}-text)">${fmt(c.ithEf,1)}</div><div class="s">${esc(tx(cat[1]))} · ${T('sombra y biotipo','shade and biotype')}</div></div></div>
        ${barraITH(c.ith, c.ithEf)}
        <p class="small muted">${T('El ITH efectivo descuenta lo que alivia la sombra y la adaptación del biotipo (cebú +3, cruzas +1.5). Peligro (79–83): jadeo rápido, +7 % de mantenimiento; emergencia (≥ 84): boca abierta, +18 %.','Effective THI discounts what shade and biotype adaptation relieve (zebu +3, crosses +1.5). Danger (79–83): rapid panting, +7 % maintenance; emergency (≥ 84): open mouth, +18 %.')}</p></div>
      <div class="tbl"><table><thead><tr><th>${T('Temporada','Season')}</th><th class="r">T °C</th><th class="r">${T('Máx.','Max.')} °C</th><th class="r">HR %</th><th class="r">${T('ITH medio','Mean THI')}</th></tr></thead><tbody>${filasT}</tbody></table>
      <p class="tiny muted" style="padding:0 10px">${T('Normales climatológicas aproximadas de','Approximate climate normals for')} ${esc(R.ref)}.</p></div>
    </div></div>

  <div class="card"><h3>${T('Infraestructura y sistema','Infrastructure and system')}</h3><div class="grid g4">
    <label class="f"><span>${T('Sombra','Shade')}${ayuda('sombra')}</span>${sel('i_som',SOMBRAS,c.sombra)}</label>
    <label class="f"><span>${T('Piso y drenaje del corral','Pen floor and drainage')}${ayuda('piso')}</span>${sel('i_pis',PISOS,c.piso)}</label>
    <label class="f"><span>${T('Sistema de producción','Production system')}${ayuda('sistemaP')}</span>${sel('i_sis',SISTEMAS,c.sistema)}</label>
    <label class="f"><span>${T('Sulfatos en el agua (mg/L)','Water sulfates (mg/L)')}${ayuda('sAgua')}</span><input type="number" id="i_sag" value="${c.sAgua}"></label>
  </div>
  <div class="semaf" style="margin-top:14px">${checklistInfra().map(([n,a,b])=>`<div class="${n}"><b>${a}</b><span class="muted small">${b}</span></div>`).join('')}</div></div>

  <div class="card"><h3>${T('Ambiente que usa el modelo','Environment used by the model')} <span class="muted small">(${T('se llena con la región; corrígelo con tus registros','filled from the region; correct it with your records')})</span></h3><div class="grid g4">
    <label class="f"><span>${T('Temperatura media del mes anterior (°C)','Previous month mean temperature (°C)')}${ayuda('tPrev')}</span><input type="number" id="c_tp" value="${c.tPrev}"></label>
    <label class="f"><span>${T('Temperatura media actual (°C)','Current mean temperature (°C)')}${ayuda('tAct')}</span><input type="number" id="c_ta" value="${c.tAct}"></label>
    <label class="f"><span>${T('Humedad relativa (%)','Relative humidity (%)')}${ayuda('ith')}</span><input type="number" id="c_hr" value="${c.hr}"></label>
    <label class="f"><span>${T('Jadeo','Panting')}${ayuda('jadeo')}</span><select id="c_ja"><option value="no" ${c.jadeo==='no'?'selected':''}>${T('No jadean','No panting')}</option><option value="rapido" ${c.jadeo==='rapido'?'selected':''}>${T('Jadeo rápido y superficial','Rapid shallow panting')}</option><option value="abierta" ${c.jadeo==='abierta'?'selected':''}>${T('Jadeo con boca abierta','Open-mouth panting')}</option></select></label>
    <label class="f"><span>${T('Lodo en el corral (cm)','Pen mud depth (cm)')}${ayuda('lodo')}</span><input type="number" id="c_lo" value="${c.lodo}"></label>
    <div class="f" style="font-size:14px;color:var(--muted)">${T('Noches','Nights')}${ayuda('noche')}<label class="row" style="color:var(--text);gap:8px"><input type="checkbox" id="c_no" ${c.noche?'checked':''}> ${T('Refresca por la noche (< 20 °C)','Cools down at night (< 20 °C)')}</label></div>
  </div></div>
  ${siguiente('region')}`;
  const cambiaRegion = (rg, edo) => { S.region = rg; S.edo = edo || REGIONES[rg].edos[0]; S.cond.sombra = S.cond.sombra||'lamina'; aplicarRegion(S); cargarRequerimientos(S); S.programa=null; guardar(); render(); toast(tx(REGIONES[rg].n)); };
  $$('path.edo',el).forEach(p=>p.addEventListener('click',()=>cambiaRegion(REGION_DE_EDO[p.dataset.edo], p.dataset.edo)));
  $$('[data-reg]',el).forEach(b=>b.addEventListener('click',()=>cambiaRegion(b.dataset.reg)));
  $$('[data-temp]',el).forEach(b=>b.addEventListener('click',()=>{ S.temporada=b.dataset.temp; aplicarRegion(S); cargarRequerimientos(S); S.programa=null; guardar(); render(); }));
  [['#i_som','sombra'],['#i_pis','piso'],['#i_sis','sistema']].forEach(([id,k])=>$(id,el).addEventListener('change',e=>{ S.cond[k]=e.target.value; const sAg=S.cond.sAgua; aplicarRegion(S); S.cond.sAgua=sAg; cargarRequerimientos(S); S.programa=null; guardar(); render(); }));
  $('#i_sag',el).addEventListener('change',e=>{ S.cond.sAgua=num(e.target.value)||0; cargarRequerimientos(S); guardar(); render(); });
  const set = (id,k)=>$(id,el).addEventListener('change',e=>{ S.cond[k]=num(e.target.value)??0; if(k==='tAct'||k==='hr'){ S.cond.ith=Math.round(ITH(S.cond.tAct,S.cond.hr)*10)/10; S.cond.ithEf=Math.round((S.cond.ith-SOMBRAS[S.cond.sombra].dITH-(ADAPT_ITH[S.biotipo]||0))*10)/10; } cargarRequerimientos(S); S.programa=null; guardar(); render(); });
  set('#c_tp','tPrev'); set('#c_ta','tAct'); set('#c_hr','hr'); set('#c_lo','lodo');
  $('#c_ja',el).addEventListener('change',e=>{ S.cond.jadeo=e.target.value; cargarRequerimientos(S); guardar(); render(); });
  $('#c_no',el).addEventListener('change',e=>{ S.cond.noche=e.target.checked; cargarRequerimientos(S); guardar(); render(); });
  $('#aplPrecios',el).addEventListener('click',()=>{ preciosRegion(S); S.resultado=null; S.programa=null; guardar(); toast(T('Precios regionales aplicados','Regional prices applied')); });
  $('#aplIngr',el).addEventListener('click',()=>{ ING_LIB.forEach(r=>S.sel[r[0]] = R.sel.includes(r[0])); S.resultado=null; S.programa=null; guardar(); toast(T('Ingredientes típicos seleccionados','Typical ingredients selected')); });
}
function filasEstudios(lista){
  return lista.flatMap(e=>e.filas.map((f,i)=>`<tr><td class="wrap" style="min-width:220px">${esc(tx(f[0]))}${i===0?`<br><span class="muted tiny">${esc(e.corta)} · ${esc(tx(e.lugar))}</span>`:''}</td><td class="r">${f[1]!=null?fmt(f[1],2):'—'}</td><td class="r">${f[2]!=null?fmt(f[2],2):'—'}</td></tr>`)
    .concat(e.nota?[`<tr><td colspan="3" class="wrap small muted">${esc(tx(e.nota))}</td></tr>`]:[])).join('');
}
function tarjetaEstudios(rg){
  const L = ESTUDIOS.filter(e=>e.r===rg);
  return `<div class="card"><h3>${T('Resultados publicados en esta región','Published results in this region')}${ayuda('refs')}</h3>
    ${L.length?`<div class="tbl"><table><thead><tr><th>${T('Sistema y estudio','System and study')}</th><th class="r">GDP kg/d</th><th class="r">${T('Conversión','Conversion')}</th></tr></thead><tbody>${filasEstudios(L)}</tbody></table></div>`
      :`<p class="muted small" style="margin:0">${T('Aún no hay estudios capturados para esta región. En el Tablero (Bloque 9) encontrarás los de otras regiones de México y de EUA como referencia.','No studies entered for this region yet. The Dashboard (Block 9) lists those from other Mexican regions and the US as a reference.')}</p>`}</div>`;
}
function checklistInfra(){
  const c = S.cond, eng = S.cat==='engorda', calor = c.ithEf>=75;
  return [
    [c.sombra==='ninguna'&&calor?'bad':c.sombra==='lamina'&&calor?'warn':'ok', T('Sombra','Shade'), T('2.5–4 m² por animal en clima cálido; un domo con ventiladores reduce el consumo y mejora la eficiencia (Avendaño-Reyes et al., 2025).','2.5–4 m² per head in hot climates; a dome with fans lowers intake and improves efficiency (Avendaño-Reyes et al., 2025).')],
    [c.lodo>10?'bad':c.lodo>4?'warn':'ok', T('Corral seco','Dry pen'), T('Pendiente de 3–5 %, montículos y 15–25 m² por animal en zonas secas o 30–45 m² en zonas lluviosas.','3–5 % slope, mounds and 15–25 m² per head in dry areas or 30–45 m² in rainy areas.')],
    ['info', T('Comedero','Feed bunk'), eng ? T('30–45 cm lineales por animal en finalización con dos repartos al día; 15 cm si hay alimento a libre acceso.','30–45 cm of bunk per head in finishing with two feedings a day; 15 cm with free access.') : T('45–60 cm por animal si comen al mismo tiempo (vacas y vaquillas).','45–60 cm per head when eating at once (cows and heifers).')],
    [calor?'warn':'info', T('Agua','Water'), T(`Limpia y a libre acceso: ≈ ${fmt(((S.reqInfo&&S.reqInfo.dmi)||8)*(c.tAct>25?5:3.5),0)} L por animal al día con este clima. Sulfatos > 1,000 mg/L: riesgo de polioencefalomalacia.`,`Clean and freely available: ≈ ${fmt(((S.reqInfo&&S.reqInfo.dmi)||8)*(c.tAct>25?5:3.5),0)} L per head per day in this climate. Sulfates > 1,000 mg/L: polioencephalomalacia risk.`)]
  ];
}

</script>
<script>
"use strict";
/* ================= BLOQUE 6 · FORMULACIÓN ================= */
function renderFormulacion(el){
  const sel = S.ingredientes.filter(i=>S.sel[i.id]);
  el.innerHTML = `${cabecera('formulacion',T('Presiona Formular: RatioBos busca la ración de menor costo por kg de materia seca que cubre lo que necesita tu ganado, ajusta la energía y el consumo hasta que cuadran y te dice cuánto va a ganar y cuánto cuesta cada kilo.','Press Formulate: RatioBos searches for the lowest-cost ration per kg of dry matter that covers what your cattle need, adjusts energy and intake until they match and tells you how much they will gain and what each kilo costs.'))}
  ${teoriaDe(['lp','iterativo','lectura'])}
  <div class="card"><div class="row between">
    <div class="chips">
      <span class="badge pri">${esc(tx(CATEGORIAS[S.cat].n))}</span><span class="badge pri">${esc(tx(BIOTIPOS[S.biotipo].n))}</span>
      <span class="badge pri">${fmt(S.animal.pv,0)} kg${esCrec()?' · '+fmt(S.animal.adg,2)+' kg/d':''}</span><span class="badge pri">${sel.length} ${T('ingredientes','ingredients')}</span>
      ${S.reqEditado?`<span class="badge warn">${T('requerimientos editados','edited requirements')}</span>`:''}
    </div>
    <button class="btn lg accent" id="formular">⚙ ${T('Formular','Formulate')}</button></div></div>
  <div id="res"></div>
  <div class="card">
    <h3>${T('Evaluar una fórmula existente','Evaluate an existing formula')}${ayuda('evaluar')}</h3>

function tablaNutrientes(nutr, req, restr){

/* semáforo de salud ruminal */
function semaforo(n, formula, cat){
  const urea = (formula.find(x=>x.id==='urea')||{pct:0}).pct;
  const ureaPC = n.PC>0 ? 100*urea*2.88/n.PC : 0;
  const lim = CATEGORIAS[cat].lim, fdnMin = (lim.FDNef||[0])[0]||0;
  const CaP = n.P>0 ? n.Ca/n.P : 0;
  const it = [];
  it.push([n.FDNef < fdnMin-0.5 ? 'bad' : n.FDNef < fdnMin+1 ? 'warn' : 'ok', T('Fibra efectiva','Effective fiber'), `${fmt(n.FDNef,1)} % · ${T('acidosis y timpanismo','acidosis and bloat')}`]);
  it.push([n.EE>7 ? 'bad' : n.EE>6.5 ? 'warn' : 'ok', T('Grasa total','Total fat'), `${fmt(n.EE,1)} % · ${T('digestión de la fibra','fiber digestion')}`]);
  it.push([urea>1.2 || ureaPC>35 ? 'bad' : urea>1.0 || ureaPC>25 ? 'warn' : 'ok', T('Urea','Urea'), `${fmt(urea,2)} % ${T('de la MS','of DM')} · ${fmt(ureaPC,0)} % ${T('de la PC','of CP')}`]);
  it.push([n.S>0.40 ? 'bad' : n.S>0.30 ? 'warn' : 'ok', T('Azufre','Sulfur'), `${fmt(n.S,2)} % · ${T('polioencefalomalacia (sin contar el agua)','polioencephalomalacia (excluding water)')}`]);
  it.push([n.PDRb < -5 ? 'bad' : n.PDRb < -0.5 ? 'warn' : 'ok', T('Nitrógeno para los microbios','Nitrogen for microbes'), `${fmt(n.PDRb,1)} g/kg · ${T('balance de PDR','RDP balance')}`]);
  it.push([CaP<1.2 ? 'bad' : CaP<1.5 ? 'warn' : 'ok', 'Ca : P', `${fmt(CaP,2)} : 1 · ${T('cálculos urinarios','urinary calculi')}`]);
  return `<div class="semaf">${it.map(([c,a,b])=>`<div class="${c}"><b>${c==='ok'?'●':c==='warn'?'▲':'■'} ${a}</b><span class="muted small">${b}</span></div>`).join('')}</div>`;
}
function bal(etq, req, sup, u, d=1){

}

function pintarEvaluacion(){

function curvaSVG(curva, fases){
  if(curva.length<2) return '';
  const W=640, H=260, m={l:52,r:16,t:14,b:34};
  const xs=curva.map(p=>p[0]), ys=curva.map(p=>p[1]);
  const x0=0, x1=Math.max(...xs), y0=Math.floor(Math.min(...ys)/50)*50, y1=Math.ceil(Math.max(...ys)/50)*50;
  const X = v => m.l + (v-x0)/(x1-x0||1)*(W-m.l-m.r), Y = v => H-m.b - (v-y0)/(y1-y0||1)*(H-m.t-m.b);
  const pts = curva.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const yt = []; for(let v=y0; v<=y1; v+=50) yt.push(v);
  const xt = []; const pasoX = x1>200?30:x1>90?15:7; for(let v=0; v<=x1; v+=pasoX) xt.push(v);
  let acc=0; const cortes = fases.slice(0,-1).map(f=>{ acc+=f.dias; return acc; });
  return `<div class="curva"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Curva de crecimiento','Growth curve')}">
    ${yt.map(v=>`<line class="rej" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    ${xt.map(v=>`<text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle">${v}</text>`).join('')}
    ${cortes.map(d=>`<line class="fase" x1="${X(d)}" x2="${X(d)}" y1="${m.t}" y2="${H-m.b}"/>`).join('')}
    <polygon class="area" points="${X(curva[0][0])},${H-m.b} ${pts} ${X(curva[curva.length-1][0])},${H-m.b}"/>
    <polyline class="lin" points="${pts}"/>
    <line class="eje" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>
    <text x="${(W+m.l)/2}" y="${H-4}" text-anchor="middle">${T('días en corral','days on feed')}</text>
    <text x="14" y="${(H-m.b)/2}" text-anchor="middle" transform="rotate(-90 14 ${(H-m.b)/2})">kg</text></svg></div>`;
}
function pintarPrograma(){
  const box = $('#resProg'); if(!box) return;
  const P = S.programa;
  if(!P){ box.innerHTML=`<div class="empty">${ill('i-calendar')}<p>${T('Presiona <b>Formular el programa</b> para ver los días, el costo total y la utilidad.','Press <b>Formulate the program</b> to see days, total cost and profit.')}</p></div>`; return; }
  const nombre = id => tx((S.ingredientes.find(i=>i.id===id)||{nombre:id}).nombre);
  const ok = P.fases.filter(f=>f.r.ok), fallas = P.fases.filter(f=>!f.r.ok);
  const ids = [...new Set(ok.flatMap(f=>f.r.formula.filter(x=>x.pct>1e-6).map(x=>x.id)))];
  const pct = (f,id)=>{ const x=f.r.formula.find(y=>y.id===id); return x?x.pct:0; };
  let html = fallas.length?`<div class="alert bad"><b>${fallas.length} ${T('fase(s) sin solución:','phase(s) without solution:')}</b> ${fallas.map(f=>esc(tx(f.f.n))).join(', ')}. ${fallas.map(f=>f.r.diagnostico&&f.r.diagnostico.culpables.length?`${T('Basta relajar:','It is enough to relax:')} ${f.r.diagnostico.culpables.slice(0,3).map(esc).join('; ')}.`:T('Baja la meta de ganancia o agrega ingredientes.','Lower the gain target or add ingredients.')).join(' ')}</div>`:'';
  if(P.crec && ok.length===P.fases.length){
    const gan = P.pvF-P.pvI, compra = P.pvI*S.cond.comprakg, venta = P.pvF*S.cond.ventakg, otros = P.dias*S.cond.otrosDia;
    const util = venta-compra-P.costo-otros, equil = (compra+P.costo+otros)/P.pvF;
    html += `<div class="kpis">
      <div class="kpi"><div class="l">${T('Días en corral','Days on feed')}${ayuda('dof')}</div><div class="v">${fmt(P.dias,0)}</div><div class="s">${fmt(P.pvI,0)} → ${fmt(P.pvF,0)} kg (${fmt(gan/P.dias,2)} kg/d)</div></div>
      <div class="kpi"><div class="l">${T('Alimento por animal','Feed per head')}${ayuda('costoDia')}</div><div class="v">${money(P.costo,0)}</div><div class="s">${fmt(P.cms,0)} kg MS</div></div>
      <div class="kpi"><div class="l">${T('Costo de alimento / kg ganado','Feed cost / kg gained')}${ayuda('costoKgGan')}</div><div class="v">${money(P.costo/gan)}</div><div class="s">${T('conversión','feed:gain')} ${fmt(P.cms/gan,2)}</div></div>
      <div class="kpi"><div class="l">${T('Utilidad por cabeza','Profit per head')}${ayuda('margen')}</div><div class="v" style="color:${util>=0?'var(--ok-text)':'var(--bad-text)'}">${money(util,0)}</div><div class="s">${T('equilibrio','break-even')}: ${money(equil)}/kg${ayuda('equilibrio')}</div></div>
    </div>
    <div class="card"><h3>${T('Curva de crecimiento','Growth curve')}</h3>${curvaSVG(P.curva, P.fases)}
      <p class="small muted">${T('Las líneas punteadas marcan el cambio de ración. Crecimiento simulado día a día con la ganancia permitida por cada ración y el consumo esperado a cada peso.','Dashed lines mark ration changes. Growth simulated day by day with each ration’s allowable gain and the expected intake at each weight.')}</p></div>
    <div class="card"><h3>${T('Economía del lote','Group economics')} (${fmt(S.cond.cabezas,0)} ${T('cabezas','head')})</h3><div class="tbl"><table><tbody>
      <tr><td>${T('Compra','Purchase')} (${fmt(P.pvI,0)} kg × ${money(S.cond.comprakg)})</td><td class="r">${money(compra*S.cond.cabezas,0)}</td></tr>
      <tr><td>${T('Alimento','Feed')}</td><td class="r">${money(P.costo*S.cond.cabezas,0)}</td></tr>
      <tr><td>${T('Otros costos','Other costs')} (${fmt(P.dias,0)} d × ${money(S.cond.otrosDia)})</td><td class="r">${money(otros*S.cond.cabezas,0)}</td></tr>
      <tr><td>${T('Venta','Sale')} (${fmt(P.pvF,0)} kg × ${money(S.cond.ventakg)})</td><td class="r">${money(venta*S.cond.cabezas,0)}</td></tr>
      <tr class="tot"><td>${T('Utilidad del lote','Group profit')}</td><td class="r">${money(util*S.cond.cabezas,0)}</td></tr>
      <tr class="sci"><td>${T('Metano del periodo','Methane over the period')}</td><td class="r">${fmt(P.ch4/1000,1)} kg CH₄/${T('animal','head')} · ${fmt(P.ch4/gan,0)} g/kg</td></tr></tbody></table></div>
      <p class="tiny muted">${T('Sin mortalidad, impuestos ni intereses del capital.','Excluding deaths, taxes and capital interest.')}</p></div>`;
  }
  if(!P.crec && ok.length===P.fases.length){
    const dest = (S.prog&&S.prog.destete)||200;
    html += `<div class="kpis">
      <div class="kpi"><div class="l">${T('Alimento por vaca al año','Feed per cow per year')}${ayuda('costoVaca')}</div><div class="v">${money(P.costo,0)}</div><div class="s">${fmt(P.cms,0)} kg MS · ${fmt(P.dias,0)} d</div></div>
      <div class="kpi"><div class="l">${T('Costo por kg de becerro destetado','Cost per kg of weaned calf')}</div><div class="v">${money(P.costo/dest)}</div><div class="s">${fmt(dest,0)} kg ${T('al destete','at weaning')}</div></div>
      <div class="kpi"><div class="l">${T('Costo promedio por día','Average cost per day')}</div><div class="v">${money(P.costo/P.dias)}</div></div>
      <div class="kpi sci"><div class="l">${T('Metano al año','Methane per year')}</div><div class="v">${fmt(P.ch4/1000,0)} kg</div><div class="s">CH₄</div></div></div>`;
  }
  html += `<div class="card"><h3>${T('Resumen por fase','Summary by phase')}</h3><div class="tbl"><table>
    <thead><tr><th>${T('Fase','Phase')}</th><th class="r">${T('Días','Days')}</th>${P.crec?`<th class="r">kg</th><th class="r">${T('GDP','ADG')}</th>`:''}<th class="r">CMS</th><th class="r">ENm</th><th class="r">ENg</th><th class="r">${T('PC','CP')} %</th><th class="r">${T('Forraje','Forage')} %</th><th class="r">${esc(S.moneda)}/t MS</th><th class="r">${esc(S.moneda)}/${T('fase','phase')}</th></tr></thead>
    <tbody>${P.fases.map(f=>f.r.ok?`<tr><td>${esc(tx(f.f.n))}${f.ajustada?` <span class="badge warn" title="${T('La meta no era alcanzable con estos ingredientes','The target was not achievable with these ingredients')}">${T('meta','target')} → ${fmt(f.adgMeta,2)}</span>`:''}</td><td class="r">${fmt(f.dias,0)}</td>${P.crec?`<td class="r">${fmt(f.desde,0)}→${fmt(f.hasta,0)}</td><td class="r">${fmt(f.ganancia/Math.max(f.dias,1),2)}</td>`:''}<td class="r">${fmt(P.crec?f.cms/Math.max(f.dias,1):f.r.dmi,2)}</td><td class="r">${fmt(f.r.nutr.NEm,2)}</td><td class="r">${fmt(f.r.nutr.NEg,2)}</td><td class="r">${fmt(f.r.nutr.PC,1)}</td><td class="r">${fmt(f.r.nutr.For,0)}</td><td class="r"><b>${fmt(f.r.costoKg*1000,0)}</b></td><td class="r">${money(f.costo,0)}</td></tr>`:`<tr><td>${esc(tx(f.f.n))}</td><td colspan="10"><span class="badge bad">${T('sin solución','no solution')}</span></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>${T('Raciones del programa (% de la MS)','Program rations (% of DM)')}</h3><div class="tbl"><table>
    <thead><tr><th>${T('Ingrediente','Ingredient')}</th>${ok.map(f=>`<th class="r">${esc(tx(f.f.n))}</th>`).join('')}</tr></thead>
    <tbody>${ids.map(id=>`<tr><td>${esc(nombre(id))}</td>${ok.map(f=>{const v=pct(f,id);return `<td class="r">${v>1e-6?fmt(v,2):'<span class="muted">—</span>'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="csvProg">⬇ ${T('Descargar programa (CSV)','Download program (CSV)')}</button></div></div>`;
  box.innerHTML = html;
  const cb = $('#csvProg'); if(cb) cb.addEventListener('click',()=>{
    const filas = [[T('Ingrediente','Ingredient'),...ok.map(f=>tx(f.f.n)+' (% MS)')], ...ids.map(id=>[nombre(id),...ok.map(f=>pct(f,id).toFixed(4))]),
      [T('Días','Days'),...ok.map(f=>f.dias)], [T('Costo por t MS','Cost per t DM'),...ok.map(f=>(f.r.costoKg*1000).toFixed(2))], ['ENm',...ok.map(f=>f.r.nutr.NEm.toFixed(3))], ['ENg',...ok.map(f=>f.r.nutr.NEg.toFixed(3))]];
    descargar(slug()+T('_programa.csv','_program.csv'), csv(filas), 'text/csv');
  });
}

/* ================= BLOQUE 8 · INFORME ================= */
function renderInforme(el){
  const r = S.resultado;
  const nombre = x => tx((S.ingredientes.find(i=>i.id===x.id)||{nombre:x.nombre}).nombre);
  let resumen = `<div class="empty">${ill('i-report')}<p>${T('Primero formula la ración en el Bloque 7; aquí aparecerá el informe redactado.','First formulate the ration in Block 7; the written report will appear here.')}</p></div>`;
  if(r && r.ok){
    const ctx = contexto(S), p = r.pred;
    const usados = r.formula.filter(x=>x.pct>1e-6).sort((a,b)=>b.pct-a.pct);
    const lim = r.restr.filter(x=>x.tipo==='nut'&&x.activa).map(x=>tx(NUT[x.k].n).toLowerCase());
    const animal = esc(etiquetaAnimal().toLowerCase());
    const textoSci = T(
      `Se formuló una ración de mínimo costo para ${animal} de ${fmt(S.animal.pv,0)} kg${ctx.crec?` con una ganancia objetivo de ${fmt(ctx.adg,2)} kg/d`:''}, mediante programación lineal (símplex en dos fases; optimalidad verificada por dualidad fuerte). Los requerimientos se calcularon con las ecuaciones de NASEM (2016) y NRC (1996) —energía neta de mantenimiento y de ganancia, proteína metabolizable con síntesis microbiana según Galyean y Tedeschi (2014), calcio y fósforo factoriales— y el consumo de materia seca predicho (${fmt(r.dmi,2)} kg/d) se ajustó junto con la energía de la dieta por iteración de punto fijo (${r.iter.length} iteraciones)${S.reqEditado?', con requerimientos editados por el usuario':''}. La composición de los ingredientes proviene de Beck et al. (2024) con valores de NASEM (2016)${S.ingredientes.some(i=>i.custom)?', además de ingredientes capturados por el usuario':''}. La ración cuesta <b>${money(r.costoKg*1000,0)} por t de MS</b> (${money(r.costoKgTCO*1000,0)} por t tal como se ofrece, ${fmt(r.msDieta,1)} % de MS) y aporta ${fmt(r.nutr.NEm,2)} y ${fmt(r.nutr.NEg,2)} Mcal/kg de ENm y ENg, ${fmt(r.nutr.PC,1)} % de PC y ${fmt(r.nutr.PM,0)} g/kg de proteína metabolizable. ${ctx.crec?`Ganancia predicha: ${fmt(p.adg,2)} kg/d (limitada por ${p.limita==='energia'?'energía':'proteína'}); metano entérico ${fmt(p.ch4,0)} g/d (IPCC, 2019).`:`Balance de energía: ${fmt(p.balE,2)} Mcal/d.`} Restricciones limitantes: ${lim.length?esc(lim.join(', ')):'ninguna de nutrientes'}.`,
      `A least-cost ration was formulated for ${animal} weighing ${fmt(S.animal.pv,0)} kg${ctx.crec?` with a target gain of ${fmt(ctx.adg,2)} kg/d`:''}, by linear programming (two-phase simplex; optimality verified by strong duality). Requirements were computed with the NASEM (2016) and NRC (1996) equations — net energy for maintenance and gain, metabolizable protein with microbial synthesis per Galyean and Tedeschi (2014), factorial calcium and phosphorus — and predicted dry-matter intake (${fmt(r.dmi,2)} kg/d) was adjusted together with dietary energy by fixed-point iteration (${r.iter.length} iterations)${S.reqEditado?', with user-edited requirements':''}. Ingredient composition comes from Beck et al. (2024) with NASEM (2016) values${S.ingredientes.some(i=>i.custom)?', plus user-entered ingredients':''}. The ration costs <b>${money(r.costoKg*1000,0)} per t DM</b> (${money(r.costoKgTCO*1000,0)} per t as fed, ${fmt(r.msDieta,1)} % DM) and supplies ${fmt(r.nutr.NEm,2)} and ${fmt(r.nutr.NEg,2)} Mcal/kg NEm and NEg, ${fmt(r.nutr.PC,1)} % CP and ${fmt(r.nutr.PM,0)} g/kg metabolizable protein. ${ctx.crec?`Predicted gain: ${fmt(p.adg,2)} kg/d (${p.limita==='energia'?'energy':'protein'}-limited); enteric methane ${fmt(p.ch4,0)} g/d (IPCC, 2019).`:`Energy balance: ${fmt(p.balE,2)} Mcal/d.`} Binding constraints: ${lim.length?esc(lim.join(', ')):'no nutrient constraints'}.`);
    const textoProd = T(
      `Ración para ${animal} de ${fmt(S.animal.pv,0)} kg. Cuesta <b>${money(r.costoKgTCO*1000,0)} por tonelada</b> tal como se mezcla; cada animal come ${fmt(r.dmi*100/r.msDieta,1)} kg al día y cuesta ${money(r.dmi*r.costoKg)} diarios. ${ctx.crec?`Se espera que gane ${fmt(p.adg,2)} kg al día, a ${money(r.dmi*r.costoKg/Math.max(p.adg,0.01))} de alimento por kilo ganado.`:`Cubre ${fmt(100*p.neSup/p.neReq,0)} % de la energía que necesita la vaca.`} RatioBos la calculó para que sea la más barata posible con tus ingredientes y precios. Revísala con tu médico veterinario zootecnista o nutriólogo antes de ofrecerla y haz el cambio de ración en forma gradual.`,
      `Ration for ${animal} weighing ${fmt(S.animal.pv,0)} kg. It costs <b>${money(r.costoKgTCO*1000,0)} per tonne</b> as mixed; each animal eats ${fmt(r.dmi*100/r.msDieta,1)} kg per day at ${money(r.dmi*r.costoKg)} daily. ${ctx.crec?`Expected gain is ${fmt(p.adg,2)} kg per day, at ${money(r.dmi*r.costoKg/Math.max(p.adg,0.01))} of feed per kilo gained.`:`It covers ${fmt(100*p.neSup/p.neReq,0)} % of the energy the cow needs.`} RatioBos computed it to be the cheapest possible with your ingredients and prices. Review it with your veterinarian or nutritionist before feeding and change rations gradually.`);
    resumen = `<div class="card"><div class="row between"><div><h2 style="margin:0 0 4px">${esc(S.proyecto.nombre||T('Ración para bovinos de carne','Beef cattle ration'))}</h2>
      <p class="muted small" style="margin-top:0">${S.proyecto.rancho?esc(S.proyecto.rancho)+' · ':''}${S.proyecto.autor?esc(S.proyecto.autor)+' · ':''}${new Date(r.fecha).toLocaleDateString(LOC())} · RatioBos ${CONFIG.version}</p></div><svg style="width:54px;height:54px"><use href="#i-logo" width="100%" height="100%"/></svg></div>
      <p style="max-width:88ch">${SCI()?textoSci:textoProd}</p>
      <p class="small muted sci" style="max-width:88ch">${T('Cítese el software como','Cite the software as')}: ${esc(tx(CONFIG.citaAutores))} (${CONFIG.anio}). <i>${CONFIG.app}: ${esc(tx(CONFIG.titulo))}</i> (${T('Versión','Version')} ${CONFIG.version}) [Software]. ${CONFIG.doi?'https://doi.org/'+CONFIG.doi:esc(CONFIG.repo)}</p>
      <div class="tbl"><table><thead><tr><th>${T('Ingrediente','Ingredient')}</th><th class="r">% MS</th><th class="r">% ${T('TCO','AF')}</th><th class="r">kg ${T('TCO por t de mezcla','AF per t of mix')}</th></tr></thead><tbody>
      ${usados.map(x=>`<tr><td>${esc(nombre(x))}</td><td class="r">${fmt(x.pct,2)}</td><td class="r">${fmt(x.pctTCO,2)}</td><td class="r">${fmt(x.pctTCO*10,1)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  el.innerHTML = `${cabecera('informe',T('Genera tu reporte, descarga las tablas o guarda todo el proyecto en un archivo para abrirlo en otra computadora.','Generate your report, download the tables or save the whole project to a file to open it on another computer.'))}
  ${resumen}
  <div class="card no-print"><h3>${T('Exportar','Export')}</h3>
    <div class="row">
      <button class="btn" id="imprimir" ${r&&r.ok?'':'disabled'}>🖨 ${T('Imprimir / PDF','Print / PDF')}</button>
      <button class="btn ghost" id="csvF" ${r&&r.ok?'':'disabled'}>⬇ ${T('Fórmula (CSV)','Formula (CSV)')}</button>
      <button class="btn ghost" id="csvN" ${r&&r.ok?'':'disabled'}>⬇ ${T('Nutrientes (CSV)','Nutrients (CSV)')}</button>
    </div>
    <h4>${T('Proyecto','Project')}</h4>
    <div class="row">
      <button class="btn ghost" id="guardarP">💾 ${T('Guardar proyecto (.json)','Save project (.json)')}</button>
      <label class="btn ghost">📂 ${T('Abrir proyecto','Open project')}<input type="file" id="abrirP" accept=".json,application/json" hidden></label>
      <button class="btn danger" id="reiniciar">${T('Reiniciar todo','Reset everything')}</button>
    </div>
    <p class="small muted">${T('Tu trabajo también se guarda automáticamente en este navegador.','Your work is also saved automatically in this browser.')}</p>
  </div>
  ${siguiente('informe')}`;
  if(r&&r.ok){
    $('#imprimir').addEventListener('click',()=>window.print());
    $('#csvF').addEventListener('click',()=>{ const u = r.formula.filter(x=>x.pct>1e-6).sort((a,b)=>b.pct-a.pct);
      descargar(slug()+'_formula.csv', csv([[T('Ingrediente','Ingredient'),'% MS','% '+T('TCO','AF'),T('kg TCO por t de mezcla','kg AF per t of mix'),T('Precio por kg TCO','Price per kg AF'),T('Aporte al costo por t MS','Cost share per t DM')], ...u.map(x=>[nombre(x),x.pct.toFixed(4),x.pctTCO.toFixed(4),(x.pctTCO*10).toFixed(2),x.precio,(x.pct*x.precioMS*10).toFixed(2)]), ['Total',100,100,1000,'',(r.costoKg*1000).toFixed(2)]]), 'text/csv'); });
    $('#csvN').addEventListener('click',()=>{ descargar(slug()+T('_nutrientes.csv','_nutrients.csv'), csv([[T('Nutriente','Nutrient'),T('Unidad','Unit'),T('Minimo','Minimum'),T('Maximo','Maximum'),T('Aporte','Supplied')], ...NUTRIENTES.map(nu=>{ const q=r.contexto.req[nu.k]||[]; return [tx(nu.n),nu.u,q[0]??'',q[1]??'',(+r.nutr[nu.k]).toFixed(4)]; })]), 'text/csv'); });
  }
  $('#guardarP').addEventListener('click',()=>{ descargar(slug()+'.json', JSON.stringify(S,null,1), 'application/json'); toast(T('Proyecto guardado','Project saved')); });
  $('#abrirP').addEventListener('change',e=>{ const file = e.target.files[0]; if(!file) return;
    file.text().then(t=>{ try{ const s=JSON.parse(t); if(s.version!==1||!s.animal) throw 0; S=completarEstado(s); guardar(); irA('inicio'); toast(T('Proyecto abierto','Project opened')); }catch(_){ e.target.closest('.card').insertAdjacentHTML('beforeend',`<div class="alert bad">${T('El archivo no es un proyecto válido de RatioBos.','The file is not a valid RatioBos project.')}</div>`); } }); });
  $('#reiniciar').addEventListener('click',e=>{ if(e.target.dataset.conf){ S=estadoInicial(); cargarRequerimientos(S); guardar(); irA('inicio'); } else { e.target.dataset.conf='1'; e.target.textContent=T('¿Seguro? Presiona otra vez para borrar todo','Sure? Press again to erase everything'); } });
}

</script>
<script>
"use strict";
/* ================= BLOQUE 9 · TABLERO DE RESULTADOS / DASHBOARD ================= */
/* ---------- gráficas SVG propias, animadas ---------- */
function ticks(a, b, n){ const span = (b-a)||1, paso0 = span/n, p10 = Math.pow(10, Math.floor(Math.log10(paso0))); const paso = [1,2,2.5,5,10].map(m=>m*p10).find(s=>s>=paso0) || p10*10;
  const t = []; for(let v=Math.ceil(a/paso)*paso; v<=b+1e-9; v+=paso) t.push(+v.toFixed(6)); return t; }
function graficaLineas(o){
  const W=560, H=300, m={l:62,r:o.y2?62:18,t:16,b:44};
  const xs = o.series.flatMap(s=>s.pts.map(p=>p[0]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const rango = sel => { const ys = o.series.filter(s=>!!s.y2===sel).flatMap(s=>s.pts.map(p=>p[1])); if(!ys.length) return null; let a=Math.min(...ys), b=Math.max(...ys); if(o.cero&&!sel) a=Math.min(a,0); const pad=(b-a)*0.08||1; return [a-pad,b+pad]; };
  const r1 = rango(false), r2 = rango(true);
  const X = v => m.l + (v-x0)/((x1-x0)||1)*(W-m.l-m.r);
  const Y = (v, alt) => { const r = alt?r2:r1; return H-m.b - (v-r[0])/((r[1]-r[0])||1)*(H-m.t-m.b); };
  const ty = ticks(r1[0], r1[1], 5), tx2 = ticks(x0, x1, 6);
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo||'')}">
    ${ty.map(v=>`<line class="rej" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v,o.dy??0)}</text>`).join('')}
    ${r2?ticks(r2[0],r2[1],5).map(v=>`<text x="${W-m.r+8}" y="${Y(v,true)+4}" fill="var(--accent-text)">${fmt(v,o.dy2??2)}</text>`).join(''):''}
    ${tx2.map(v=>`<text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle">${fmt(v,o.dx??1)}</text>`).join('')}
    <line class="eje" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>
    ${(o.vlineas||[]).map(v=>`<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--${v.c||'muted'})" stroke-dasharray="5 5"/>${X(v.x) > W-m.r-90 ? `<text x="${X(v.x)-5}" y="${H-m.b-8}" text-anchor="end"` : `<text x="${X(v.x)+5}" y="${H-m.b-8}"`} fill="var(--${v.c||'muted'})">${esc(v.t)}</text>`).join('')}

    <text x="14" y="${(H-m.b+m.t)/2}" text-anchor="middle" transform="rotate(-90 14 ${(H-m.b+m.t)/2})" fill="var(--primary-dark)">${esc(o.ylab||'')}</text>
    ${o.y2?`<text x="${W-8}" y="${(H-m.b+m.t)/2}" text-anchor="middle" transform="rotate(90 ${W-8} ${(H-m.b+m.t)/2})" fill="var(--accent-text)">${esc(o.y2lab||'')}</text>`:''}
  </svg>${o.leyenda?`<div class="legend" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:6px">${o.series.map(s=>`<span><i style="background:var(--${s.cls==='l2'?'accent':'primary'})"></i>${esc(s.etq)}</span>`).join('')}</div>`:''}</div>`;
}
function graficaBarrasH(items, o){
  const W=560, fila=30, H=items.length*fila+24, l=150, r=Math.max(96, 10+6.4*Math.max(...items.map(x=>String(x.txt).length)));
  const vmax = Math.max(...items.map(x=>x.v), 1e-9);
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo||'')}">
    ${items.map((x,i)=>{ const w = Math.max(2,(W-l-r)*x.v/vmax), y = 8+i*fila;
      return `<text x="${l-8}" y="${y+16}" text-anchor="end" ${x.yo?'font-weight="700" fill="var(--text)"':''}>${esc(x.n)}</text><rect class="b ${x.yo?'yo':''} crece" style="animation-delay:${(i*0.05).toFixed(2)}s" x="${l}" y="${y+3}" width="${w.toFixed(1)}" height="${fila-10}" rx="5"><title>${esc(x.n)}: ${esc(x.txt)}</title></rect><text x="${l+w+6}" y="${y+16}" ${x.yo?'font-weight="700" fill="var(--text)"':''}>${esc(x.txt)}</text>`; }).join('')}
  </svg></div>`;
}
function graficaRadar(items){
  const S0 = 300, c = S0/2, R = 105, n = items.length, max = 150;
  const P = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/n, rr = R*Math.min(v,max)/max; return [c+rr*Math.cos(a), c+rr*Math.sin(a)]; };
  const poly = vals => vals.map((v,i)=>P(i,v).map(z=>z.toFixed(1)).join(',')).join(' ');
  return `<div class="graf"><svg viewBox="0 0 ${S0} ${S0}" role="img" aria-label="${T('Aporte frente al requerimiento','Supply versus requirement')}">
    ${[50,100,150].map(k=>`<polygon points="${poly(items.map(()=>k))}" fill="none" stroke="var(--border)" ${k===100?'stroke-width="1.6"':''}/>`).join('')}
    ${items.map((x,i)=>{ const p = P(i,max), t = P(i,max+22); return `<line x1="${c}" y1="${c}" x2="${p[0]}" y2="${p[1]}" stroke="var(--border)"/><text x="${t[0]}" y="${t[1]+4}" text-anchor="middle">${esc(x.n)}</text>`; }).join('')}
    <polygon class="rad0" points="${poly(items.map(()=>100))}"/>
    <polygon class="rad aparece" points="${poly(items.map(x=>x.v))}"><title>${items.map(x=>x.n+' '+fmt(x.v,0)+' %').join(' · ')}</title></polygon>
  </svg></div>`;
}

/* ---------- cálculos del tablero ---------- */
function parametros(r, ctx){
  const p = r.pred, dmi = r.dmi, cd = dmi*r.costoKg, c = S.cond;
  if(!ctx.crec || !(p.adg>0)) return {cd, dmi, crec:false};
  const ing = p.adg*c.ventakg;
  return {crec:true, adg:p.adg, dmi, ea:p.adg/dmi, ca:dmi/p.adg, cd, ckg:cd/p.adg, ing, bcA: ing/cd, bcT: ing/(cd+c.otrosDia), margen: ing-cd-c.otrosDia};
}
function clonEstado(){ return JSON.parse(JSON.stringify(S)); }
function curvaOptimo(){
  const ctx0 = contexto(S); if(!ctx0.crec) return null;
  const ings = S.ingredientes.filter(i=>S.sel[i.id]);
  const g0 = S.cat==='vaquillas' ? 0.3 : S.cat==='desarrollo' ? 0.5 : 0.7, g1 = S.cat==='vaquillas' ? 1.0 : S.cat==='desarrollo' ? 1.4 : 2.0;
  const pts = [];
  for(let g=g0; g<=g1+1e-9; g+=0.1){
    const s2 = clonEstado(); s2.animal.adg = +g.toFixed(2);
    const ctx = contexto(s2), r = formularContexto(ctx, ings, null, {nem0:S.animal.nemSup});
    if(!r.ok) continue;
    const P = parametrosCon(r, s2);
    pts.push({meta:+g.toFixed(2), adg:r.pred.adg, ckg:P.ckg, margen:P.margen, bc:P.bcT, costoT:r.costoKg*1000});
  }
  if(!pts.length) return null;
  const opt = pts.reduce((a,b)=>b.margen>a.margen?b:a);
  return {pts, opt};
}
function parametrosCon(r, s){ const dmi = r.dmi, cd = dmi*r.costoKg, ing = r.pred.adg*s.cond.ventakg; return {ckg: r.pred.adg>0?cd/r.pred.adg:null, margen: ing-cd-s.cond.otrosDia, bcT: ing/(cd+s.cond.otrosDia), cd}; }
function comparaRegiones(){
  return Object.keys(REGIONES).map(k=>{
    const s2 = clonEstado(); s2.region = k; s2.edo = REGIONES[k].edos[0]; aplicarRegion(s2); preciosRegion(s2);
    const ctx = contexto(s2), ings = s2.ingredientes.filter(i=>s2.sel[i.id]);
    let r = formularContexto(ctx, ings, null, {nem0:S.animal.nemSup}), lim = false;
    /* Si el clima de la región no permite la meta (estrés calórico, lodo), se compara con la ganancia máxima posible allí */
    if(!r.ok && ctx.crec){ const g = Math.floor(gananciaMaxima(s2)*100)/100;
      if(g > 0.11){ s2.animal.adg = g; r = formularContexto(contexto(s2), ings, null, {nem0:S.animal.nemSup}); lim = r.ok; } }
    if(!r.ok) return {k, ok:false};
    const P = parametrosCon(r, s2);
    return {k, ok:true, lim, adg:r.pred.adg, ckg:P.ckg, cd:P.cd, bc:P.bcT, ithEf:s2.cond.ithEf, costoT:r.costoKg*1000};
  });
}
function sensibilidadGrano(r){
  const gr = r.formula.filter(x=>x.pct>1e-6 && (x.cat==='gra'||x.cat==='sub'||x.cat==='pro')).sort((a,b)=>b.pct*b.precioMS-a.pct*a.precioMS)[0];
  if(!gr) return null;
  const ings0 = S.ingredientes.filter(i=>S.sel[i.id]);
  const pts = [];
  for(const f of [0.7,0.8,0.9,1.0,1.1,1.2,1.3]){
    const ings = ings0.map(i=>i.id===gr.id ? Object.assign({}, i, {precio:i.precio*f}) : i);
    const rr = formularContexto(contexto(S), ings, null, {nem0:S.animal.nemSup});
    if(!rr.ok) continue;
    const uso = (rr.formula.find(x=>x.id===gr.id)||{pct:0}).pct;
    pts.push({f, costoT:rr.costoKg*1000, ckg: rr.pred.adg>0 ? rr.dmi*rr.costoKg/rr.pred.adg : null, uso});
  }
  return {id:gr.id, pts};
}

function pintarTablero(){

      return {adg:gan/P.dias, dmi:P.cms/P.dias, ea:gan/P.cms, ca:P.cms/gan, ckg:P.costo/gan, bcT: venta/(compra+P.costo+otros), bcVA:(venta-compra)/(P.costo+otros), margen:(venta-compra-P.costo-otros)}; })() : null;

      ${fila(T('Relación beneficio : costo','Benefit : cost ratio'), fmt(Pm.bcT,2), prog?fmt(prog.bcT,2):'', 'bc')}
      ${fila(T('Margen','Margin'), money(Pm.margen)+' /d', prog?money(prog.margen,0)+' /'+T('cabeza','head'):'', 'margen')}
      </tbody></table></div>
      <p class="small muted">${T('Ración actual: B/C = valor de la ganancia del día (GDP × precio de venta) ÷ (alimento + otros costos del día). Programa: B/C = venta ÷ (compra + alimento + otros costos); su valor agregado, (venta − compra) ÷ (alimento + otros), es','Current ration: B/C = value of the day’s gain (ADG × sale price) ÷ (feed + other daily costs). Program: B/C = sale ÷ (purchase + feed + other costs); its value added, (sale − purchase) ÷ (feed + other), is')} ${prog?fmt(prog.bcVA,2):T('— (formula el Programa)','— (formulate the Program)')}.</p></div>`;
  } else {
    html += `<div class="card"><h3>${T('Parámetros logrados','Achieved parameters')}</h3><div class="kpis" style="margin:0">
      <div class="kpi"><div class="l">${T('Costo por vaca al día','Cost per cow per day')}</div><div class="v">${money(Pm.cd)}</div></div>
      <div class="kpi"><div class="l">${T('Balance de energía','Energy balance')}${ayuda('balE')}</div><div class="v">${fmt(r.pred.balE,2)} Mcal/d</div></div>
      <div class="kpi"><div class="l">${T('Balance de PM','MP balance')}${ayuda('balPM')}</div><div class="v">${fmt(r.pred.balPM,0)} g/d</div></div>
      <div class="kpi"><div class="l">${T('Metano','Methane')}${ayuda('ch4')}</div><div class="v">${fmt(r.pred.ch4,0)} g/d</div></div></div></div>`;
  }
  html += `<div class="dash">`;
  /* 2. Ganancia económicamente óptima */
  const C = curvaOptimo();
  if(C){
