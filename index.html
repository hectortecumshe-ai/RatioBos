<style>
:root{
  color-scheme: light;
  --bg:#f6f5f0; --bg-soft:#ecebe3; --card:#ffffff; --text:#1d2420; --muted:#5a645e;
  --border:#e0ded4; --border-strong:#c3c1b3; --field:#8a8f86;
  --primary-rgb:47,93,80; --primary:#2f5d50; --primary-dark:#21453b; --primary-soft:rgba(var(--primary-rgb),.09);
  --on-primary:#ffffff;
  --accent-rgb:176,84,52; --accent:#b05434; --accent-soft:rgba(var(--accent-rgb),.13); --accent-text:#8a3a1f;
  --ok:#2f8f4a; --ok-text:#1d6b34; --ok-soft:#e7f5eb;
  --warn:#c27c0e; --warn-text:#8a5300; --warn-soft:#fdf3e1;
  --bad:#c43a2f; --bad-text:#a82c22; --bad-soft:#fbe9e7;
  --info:#2d78b0; --info-text:#1f5f91; --info-soft:#e6f0f8;
  --font:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",P052,"TeX Gyre Pagella",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(30,36,24,.06);
  --shadow:0 1px 2px rgba(30,36,24,.05),0 8px 24px rgba(30,36,24,.07);
  --shadow-lg:0 4px 10px rgba(30,36,24,.08),0 20px 48px rgba(30,36,24,.14);
  --ease:cubic-bezier(.2,.7,.2,1); --max:1200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
    --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
    --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
    --accent-rgb:234,146,107; --accent:#ea926b; --accent-text:#f4b596;
    --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
    --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
    --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
    --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11150f; --bg-soft:#191e17; --card:#1d241f; --text:#e9ede6; --muted:#a9b3a8;
  --border:#2c362e; --border-strong:#3f4b41; --field:#708071;
  --primary-rgb:131,196,172; --primary:#83c4ac; --primary-dark:#b2dccb; --on-primary:#0f1512;
  --accent-rgb:234,146,107; --accent:#ea926b; --accent-text:#f4b596;
  --ok:#5cc27a; --ok-text:#7fd497; --ok-soft:rgba(92,194,122,.13);
  --warn:#f0b24a; --warn-text:#f5c56f; --warn-soft:rgba(240,178,74,.13);
  --bad:#f07166; --bad-text:#f59189; --bad-soft:rgba(240,113,102,.13);
  --info:#69b2e0; --info-text:#8cc6ea; --info-soft:rgba(105,178,224,.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.34); --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
}
*,::before,::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:16.5px;line-height:1.6;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;font-weight:700}
a{color:var(--primary-dark);text-underline-offset:2px}
::selection{background:rgba(var(--primary-rgb),.22)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
button,input,select,textarea{font-family:inherit}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar-top{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);cursor:pointer;border:0;background:none;padding:0}
.brand-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:var(--shadow-sm)}
.brand-ico svg{width:22px;height:22px}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-name b{color:var(--accent)}
.brand-sub{font-size:13px;color:var(--muted);font-style:italic}
.bar-top .sp{flex:1}
.ibtn{height:36px;min-width:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:600}
.ibtn:hover{border-color:var(--primary);color:var(--primary-dark)}
.ibtn.round{padding:0;width:36px;justify-content:center}
.steps-nav{max-width:var(--max);margin:0 auto;display:flex;gap:4px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:thin}
.steps-nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;color:var(--muted);padding:5px 11px 5px 6px;border-radius:var(--r-pill);font-size:14.5px;cursor:pointer;white-space:nowrap}
.steps-nav button:hover{color:var(--text);background:var(--primary-soft)}
.steps-nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.steps-nav button.act{background:var(--primary-soft);border-color:rgba(var(--primary-rgb),.35);color:var(--primary-dark);font-weight:700}
.steps-nav button.act .n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.steps-nav button.done .n{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}

/* ---------- contenido ---------- */
main{max-width:var(--max);margin:0 auto;padding:26px 20px 40px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--primary-dark)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--primary)}
.bhead{margin:0 0 18px}
.bhead h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.35rem);margin:6px 0 8px;letter-spacing:-.015em}
.lead{color:var(--muted);margin:0;max-width:78ch;font-size:17px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow-sm)}
.card>h2,.card>h3,.card .ch{margin:0 0 12px;font-size:19px}
.card h4{margin:16px 0 8px;font-size:15.5px}
.card.soft{background:var(--bg-soft);box-shadow:none}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f .h{font-size:12.5px;font-style:italic}
input,select,textarea{font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--field);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input.num{text-align:right;max-width:112px;padding:5px 8px;font-variant-numeric:tabular-nums}
input:disabled{background:var(--bg-soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:var(--r-md);padding:9px 18px;font-size:15.5px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-dark);background:var(--card)}
.btn.link{background:none;border-color:transparent;color:var(--primary-dark);padding-left:6px;padding-right:6px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;font-weight:600}
.btn.lg{padding:13px 24px;font-size:17px}
.btn.danger{background:none;color:var(--bad-text);border-color:var(--bad)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.opt{position:relative;border:1.5px solid var(--border);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;background:var(--card);display:block;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel::after{content:"✓";position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;display:grid;place-items:center;font-weight:700}
.opt b{display:block;font-size:16.5px;margin-bottom:2px;padding-right:24px}
.opt small{color:var(--muted);font-size:13.5px;line-height:1.45;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .badge{margin-top:6px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:var(--r-pill);background:var(--bg-soft);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok-text);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn-text);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad-text);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info-text);border-color:transparent}
.badge.pri{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--bg-soft);color:var(--text);font-weight:700;font-size:13.5px;position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--bg-soft)}
tbody tr:hover td{background:color-mix(in srgb,var(--primary-soft) 60%,transparent)}
tr.cat td{background:var(--bg);font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.wrap{white-space:normal}
.alert{border-radius:var(--r-md);padding:13px 16px;margin:0 0 16px;border:1px solid;border-left-width:4px}
.alert p{margin:4px 0}
.alert ul{margin:6px 0 0;padding-left:22px}
.alert.info{background:var(--info-soft);border-color:var(--info)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.idea{background:var(--bg-soft);border-left:4px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;padding:11px 16px;margin:12px 0}
.idea b:first-child{display:block;color:var(--primary-dark)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin:0 0 18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--shadow-sm)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--primary-dark)}
.kpi .s{font-size:13px;color:var(--muted)}
.bar-h{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)));min-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--border);color:var(--text)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.next .btn.big-next{flex-direction:column;align-items:flex-end;gap:0;padding:10px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border:0;box-shadow:var(--shadow)}
.next .big-next small{font-size:12px;font-weight:500;opacity:.85}
.next .big-next span{font-size:16.5px}
code{font-family:var(--mono);background:var(--bg-soft);padding:1px 6px;border-radius:5px;font-size:.86em}
.hide{display:none!important}

/* ---------- teoría (acordeón numerado) ---------- */
.teoria{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px 22px 10px;margin:0 0 18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--primary)}
.teoria>.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0 6px}
.teoria>.th h2{margin:0;font-size:20px}
.teoria>.th p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.teoria details{border-bottom:1px solid var(--border)}
.teoria details:last-child{border-bottom:0}
.teoria summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:600;display:flex;gap:10px;align-items:center}
.teoria summary::-webkit-details-marker{display:none}
.teoria summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
.teoria details[open] summary::before{transform:rotate(90deg)}
.teoria details[open] summary{color:var(--primary-dark)}
.teoria .tb{padding:0 0 14px 22px;max-width:92ch}
.teoria .tb p,.teoria .tb li{margin:6px 0}
.teoria .tb table{font-size:14px;margin:8px 0}

/* ---------- inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--border);background:
  radial-gradient(1200px 400px at 110% -10%,rgba(var(--accent-rgb),.14),transparent 60%),
  radial-gradient(900px 500px at -10% 120%,rgba(var(--primary-rgb),.13),transparent 60%),var(--card);
  padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2.1rem,1.3rem + 3.3vw,3.4rem);line-height:1.08;margin:14px 0 16px;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--primary)}
.hero h1 .acc{color:var(--accent)}
.hero p.big{font-size:18.5px;color:var(--muted);margin:0 0 22px;max-width:56ch}
.hero p.big b{color:var(--text)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.illus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.illus .ic{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-sm)}
.illus .ic.wide{grid-column:1/-1}
.illus .ic .t{font-size:12px;color:var(--muted);margin-bottom:4px}
.illus svg{width:100%;height:auto;display:block}
.section-t{margin:40px 0 4px;font-size:26px}
.section-l{margin:0 0 16px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.howto div{padding:14px 16px;border-right:1px solid var(--border)}
.howto div:last-child{border-right:0}
.howto .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark)}
.howto b{display:block;margin:2px 0 4px}
.howto span{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
.inc{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.inc button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,transform .15s}
.inc button:hover{border-color:var(--primary);transform:translateY(-2px)}
.inc .num{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.inc h3{margin:2px 0 4px;font-size:18px}
.inc p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.why{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 26px;margin-top:36px}
.why h3{margin:0 0 8px;font-size:19px}
.why .cite{font-size:14px;color:var(--muted)}
.why .cite .k{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark);margin-bottom:8px}
footer.pie{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px 40px;border-top:1px solid var(--border);margin-top:20px}

/* ---------- ayuda ---------- */
dialog{border:1px solid var(--border);border-radius:var(--r-lg);padding:0;max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--text);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(10,14,10,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
dialog .dh h2{margin:0;font-size:20px}
dialog .db{padding:10px 22px 20px}

@media (max-width:900px){
  .hero,.why{grid-template-columns:minmax(0,1fr)}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .howto div{border-right:0;border-bottom:1px solid var(--border)}
}
@media (max-width:600px){
  body{font-size:16px}
  main{padding:18px 16px 30px}
  .bar-top{padding:8px 16px 4px}
  .brand-sub,.ibtn .lbl{display:none}
  .illus{grid-template-columns:1fr}
  .card{padding:16px}
  .teoria{padding:4px 16px 8px}
}
@media print{
  .bar,.next,.no-print,.teoria,footer.pie{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  main{max-width:none;padding:0}
}
/* ================= RatioBos · capa visual adicional ================= */
.brand-ico{background:none;box-shadow:none;width:40px;height:40px}
.brand-ico svg{width:40px;height:40px}
.brand-name{font-size:22px}
.brand-name i{font-style:italic;color:var(--accent)}
.langsw{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:3px;background:var(--card)}
.langsw button{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit;letter-spacing:.04em}
.langsw button.on{background:var(--primary);color:var(--on-primary)}
.progress{max-width:var(--max);margin:0 auto;padding:0 20px 8px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.progress .track{flex:1;height:4px;border-radius:4px;background:var(--bg-soft);overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .5s var(--ease)}
main>*{animation:subir .45s var(--ease) both}
main>*:nth-child(2){animation-delay:.04s} main>*:nth-child(3){animation-delay:.08s} main>*:nth-child(4){animation-delay:.12s}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.bhead .bill{width:118px;height:118px;border-radius:28px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,rgba(var(--accent-rgb),.22),transparent 60%),radial-gradient(circle at 70% 80%,rgba(var(--primary-rgb),.18),transparent 60%),var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow)}
.bhead .bill svg{width:92px;height:92px}
.ico{display:inline-block;vertical-align:middle}
.opt .oico{float:right;width:46px;height:46px;margin:-2px 22px 4px 8px}
.opt.sel .oico{filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.hero .art{position:relative;min-height:340px}
.hero .art .stage{position:absolute;inset:0;border-radius:24px;background:
  radial-gradient(closest-side at 55% 58%,rgba(var(--accent-rgb),.20),transparent),
  radial-gradient(closest-side at 30% 30%,rgba(var(--primary-rgb),.14),transparent)}
.hero .art svg.big{position:absolute}
.float{animation:flotar 6s ease-in-out infinite}
.float.d2{animation-delay:-2s} .float.d3{animation-delay:-4s}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.hero .art .mini{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted)}
.hero .art .mini b{display:block;font-size:17px;color:var(--primary-dark)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:28px;font-weight:700;color:var(--primary-dark);line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.inc button .ib{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft)}
.inc button .ib svg{width:40px;height:40px}
.empty{display:flex;gap:18px;align-items:center;background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--r-lg);padding:18px 20px;margin:0 0 18px}
.empty svg{flex:none;width:84px;height:84px}
.empty p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);font-size:14.5px;box-shadow:var(--shadow-lg);transition:.3s var(--ease);z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chart-wrap{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:20px;align-items:center}
.legend{display:grid;gap:6px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.cmpbar{display:grid;grid-template-columns:130px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:13.5px;margin:5px 0}
.cmpbar .tr{position:relative;height:12px;background:var(--bg-soft);border-radius:6px}
.cmpbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--accent)))}
.cmpbar .tr i.hi{background:linear-gradient(90deg,var(--accent),#e4a64f)}
.cmpbar .tr b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55}
.cmpbar .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.flag{display:inline-grid;place-items:center;min-width:28px;height:18px;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--primary);color:var(--on-primary);margin-right:6px;vertical-align:2px}
.doi{display:inline-flex;align-items:center;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--border-strong)}
.doi span:first-child{background:#3b6aa0;color:#fff;padding:3px 7px}
.doi span:last-child{background:var(--card);color:var(--text);padding:3px 8px}
@media (max-width:900px){ .chart-wrap{grid-template-columns:minmax(0,1fr)} .hero .art{min-height:300px} }
@media (max-width:600px){ .bhead .bill{width:78px;height:78px;border-radius:20px} .bhead .bill svg{width:60px;height:60px} .langsw button{padding:4px 9px} .cmpbar{grid-template-columns:96px minmax(0,1fr) 48px} }
@media (max-width:600px){ .bar-top{gap:6px} .brand-name{font-size:18px} .brand-ico,.brand-ico svg{width:32px;height:32px} #pill{display:none} .ibtn.round{width:32px;min-width:32px;height:32px} }
@media print{ .progress,.toast{display:none!important} .bhead .bill{box-shadow:none} }
/* ---- ayuda contextual «?» / context help ---- */
.qh{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;border-radius:50%;font-size:11px;font-weight:700;line-height:1;font-style:normal;
  color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);cursor:help;vertical-align:1px;user-select:none;transition:.15s var(--ease)}
.qh:hover,.qh:focus-visible{background:var(--primary);color:var(--on-primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
#qtip{position:fixed;z-index:120;background:var(--card);color:var(--text);border:1px solid var(--border-strong);border-radius:14px;padding:12px 14px 10px;box-shadow:var(--shadow-lg);
  font-size:13.5px;line-height:1.45;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s;border-top:3px solid var(--accent)}
#qtip.on{opacity:1;transform:none}
#qtip .qt{display:block;font-size:14.5px;color:var(--primary-dark);margin-bottom:4px}
#qtip p{margin:0 0 8px}
#qtip .qe{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#qtip ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#qtip li{position:relative;padding-left:16px}
#qtip li::before{content:"";position:absolute;left:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--info)}
#qtip li.ok::before{background:var(--ok)} #qtip li.warn::before{background:var(--warn)} #qtip li.bad::before{background:var(--bad)}
@media print{ .qh,#qtip{display:none!important} }

/* ---- vista productor / científico ---- */
html[data-modo="prod"] .sci, html[data-modo="cien"] .prod{display:none!important}
.modesw button{display:inline-flex;align-items:center;gap:6px}
.modesw svg{width:15px;height:15px;flex:none}
.consejo{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,var(--primary-soft),var(--card));border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--r-lg);padding:14px 18px;margin:0 0 18px}
.consejo>svg{flex:none;width:36px;height:36px}
.consejo p{margin:0}
.consejo .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.vistas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.vista{border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;background:var(--card);box-shadow:var(--shadow-sm);transition:.2s var(--ease)}
.vista.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 28%,transparent),var(--shadow-sm)}
.vista h3{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.vista h3 svg{width:34px;height:34px;flex:none}
.vista ul{margin:8px 0 14px;padding-left:18px;color:var(--muted);font-size:14.5px}
.vista .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-left:auto}
.modelo{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Palatino Linotype",serif;font-size:16px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 18px;line-height:2;overflow-x:auto}
.mezcla{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin:10px 0 12px}
.mezcla label{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer}
.mezcla label span{display:flex;gap:8px;align-items:center}
.mezcla label b{font-size:18px;color:var(--primary-dark);font-variant-numeric:tabular-nums;white-space:nowrap}
.mezcla input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.mezcla label:has(input:checked){opacity:.5;text-decoration:line-through}
.granja{margin:0;padding-left:20px;display:grid;gap:6px}
@media (max-width:600px){ .modesw span{display:none} .modesw button{padding:5px 8px} }
/* ================= RatioBos · capa visual propia ================= */
.opt .oico.big{width:64px;height:46px;margin-right:22px}
.hero .art .chip-n{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);line-height:1.3}
.hero .art .chip-n b{display:block;font-size:16px;color:var(--accent-text)}
/* base de expresión: materia seca / tal como se ofrece */
.basesw{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:3px;background:var(--card)}
.basesw button{border:0;background:none;color:var(--muted);font-weight:700;font-size:12.5px;padding:4px 11px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit}
.basesw button.on{background:var(--accent);color:#fff}
/* requerimientos diarios del animal */
.req-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.req-d div{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px}
.req-d .l{font-size:12.5px;color:var(--muted)}
.req-d .v{font-size:21px;font-weight:700;color:var(--primary-dark);font-variant-numeric:tabular-nums}
.req-d .s{font-size:12px;color:var(--muted)}
/* balance (aporte vs. requerimiento diario) */
.bal{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.bal .tr{position:relative;height:16px;background:var(--bg-soft);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.bal .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 65%,var(--accent)))}
.bal .tr i.mant{background:color-mix(in srgb,var(--primary) 35%,var(--bg-soft))}
.bal .tr b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.6}
.bal .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* gráfica de crecimiento */
.curva svg{width:100%;height:auto;display:block}
.curva .eje{stroke:var(--border-strong);stroke-width:1}
.curva .rej{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.curva text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.curva .lin{fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.curva .area{fill:color-mix(in srgb,var(--primary) 12%,transparent)}
.curva .fase{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 5}
/* iteraciones del modelo energético */
.iter td,.iter th{font-size:13.5px}
.conv{display:inline-flex;align-items:center;gap:6px}
.conv i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
/* tarjetas de ambiente / sostenibilidad */
.eco{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.eco .e{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.eco .e svg{flex:none;width:52px;height:42px}
.eco .e .v{font-size:20px;font-weight:700;color:var(--primary-dark);font-variant-numeric:tabular-nums}
.eco .e .l{font-size:12.5px;color:var(--muted)}
/* semáforo de riesgos ruminales */
.semaf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.semaf div{border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:var(--r-md);padding:10px 12px;background:var(--card);font-size:14px}
.semaf div.warn{border-left-color:var(--warn)} .semaf div.bad{border-left-color:var(--bad)} .semaf div.info{border-left-color:var(--info)}
.semaf b{display:block}
/* mapa de México */
.mapa-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.mapa{width:100%;height:auto;display:block}
.mapa .edo{fill:color-mix(in srgb,var(--rc) 38%,var(--card));stroke:var(--card);stroke-width:1.3;cursor:pointer;transition:fill .2s,opacity .2s}
.mapa .edo:hover{fill:color-mix(in srgb,var(--rc) 75%,var(--card))}
.mapa .edo.sel{fill:var(--rc)}
.mapa .edo.edosel{stroke:var(--text);stroke-width:2.6}
.mapa .etq text{font-family:var(--font);font-size:17px;font-weight:700;fill:var(--text);opacity:.55;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.mapa .etq.sel text{opacity:1}
.mapa.chico .edo{cursor:default}
.rchip{cursor:pointer;font-family:inherit}
.rchip i{width:11px;height:11px;border-radius:3px;background:var(--rc);display:inline-block}
.rchip.on{border-color:var(--text);font-weight:700}
.rinfo dl{margin:0 0 12px;display:grid;gap:4px}
.rinfo dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-top:6px}
.rinfo dd{margin:0;font-size:14.5px;color:var(--text)}
/* barra del ITH */
.ith{position:relative;height:46px;margin:6px 0 4px}
.ith .tramos{position:absolute;left:0;right:0;top:8px;height:14px;border-radius:7px;overflow:hidden;background:var(--bg-soft)}
.ith .tramos i{position:absolute;top:0;bottom:0}
.ith .tramos i.ok{background:var(--ok)} .ith .tramos i.info{background:var(--info)} .ith .tramos i.warn{background:var(--warn)} .ith .tramos i.bad{background:var(--bad)}
.ith .m{position:absolute;top:2px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--text)}
.ith .m.efe{background:var(--card);border:2px solid var(--text);width:10px;margin-left:-5px}
.ith .esc{position:absolute;left:0;right:0;top:28px;font-size:11.5px;color:var(--muted)}
.ith .esc span{position:absolute;transform:translateX(-50%)} .ith .esc span:first-child{left:0;transform:none} .ith .esc span:last-child{transform:none}
/* tablero */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.dash .card{margin:0}
.graf svg{width:100%;height:auto;display:block}
.graf text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.graf .eje{stroke:var(--border-strong)} .graf .rej{stroke:var(--border);stroke-dasharray:3 4}
.graf .l1{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.graf .l2{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.graf .pt{fill:var(--card);stroke-width:2.5}
.graf .opt{fill:var(--accent)}
.graf .b{fill:color-mix(in srgb,var(--primary) 70%,var(--card))} .graf .b.yo{fill:var(--accent)}
.graf .rad{fill:color-mix(in srgb,var(--primary) 22%,transparent);stroke:var(--primary);stroke-width:2.5}
.graf .rad0{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4}
.dibuja{stroke-dasharray:1;stroke-dashoffset:1;animation:dibujar 1.4s var(--ease) forwards}
@keyframes dibujar{to{stroke-dashoffset:0}}
.crece{transform-box:fill-box;transform-origin:left center;animation:crecer .9s var(--ease) both}
.creceV{transform-box:fill-box;transform-origin:center bottom;animation:crecerV .9s var(--ease) both}
@keyframes crecer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes crecerV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.aparece{animation:subir .6s var(--ease) both}
/* animación de las ilustraciones (se activa con --anim:running) */
.cola{transform-box:fill-box;transform-origin:100% 0%;animation:colear 2.6s ease-in-out infinite;animation-play-state:var(--anim,paused)}
@keyframes colear{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.cabeza{transform-box:view-box;transform-origin:132px 50px;animation:cabecear 5.5s ease-in-out infinite;animation-play-state:var(--anim,paused)}
@keyframes cabecear{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-5deg) translateY(1px)}90%{transform:rotate(2deg)}}
.hoja{transform-box:fill-box;transform-origin:50% 100%;animation:mecer 3.2s ease-in-out infinite;animation-play-state:var(--anim,paused)}
@keyframes mecer{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.gira{transform-box:fill-box;transform-origin:center;animation:girar 3s linear infinite;animation-play-state:var(--anim,paused)}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .cola,.cabeza,.hoja,.gira,.dibuja,.crece,.creceV,.aparece{animation:none!important;stroke-dashoffset:0} }
@media (max-width:900px){ .mapa-wrap{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){ .bal{grid-template-columns:96px minmax(0,1fr) 70px} .basesw button{padding:4px 8px} }
@media print{ .basesw{display:none!important} }

/* Barra superior: el resumen y el lema nunca parten en dos líneas */
#pill{min-width:0;max-width:44vw;flex:0 1 auto}
#pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand-sub{white-space:nowrap}
@media (max-width:1380px){ .brand-sub{display:none} }

/* Imprimir solo la hoja de mezclado */
@media print{
  body.solo-mezcla *{visibility:hidden}
  body.solo-mezcla .hoja-mezcla, body.solo-mezcla .hoja-mezcla *{visibility:visible}
  body.solo-mezcla .hoja-mezcla{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}
  body.solo-mezcla .hoja-mezcla .mezcla label{break-inside:avoid}
}

</style>

function aplicarRegion(s){
  const R = REGIONES[s.region||'OB'], t = R.t[s.temporada||'seca'], c = s.cond;
  c.tAct = t[0]; c.hr = t[2];
  const tp = {seca:'fresca', lluvias:'seca', fresca:'lluvias'}[s.temporada||'seca'];
  c.tPrev = R.t[tp][0];
  c.noche = (t[0]-(t[1]-t[0])) < 20;                    // mínima estimada < 20 °C
  const ithMed = ITH(t[0], t[2]), ef = ithMed - (SOMBRAS[c.sombra||'lamina'].dITH) - (ADAPT_ITH[s.biotipo]||0);
  c.ith = Math.round(ithMed*10)/10; c.ithEf = Math.round(ef*10)/10;

  c.lodo = Math.round(lodoBase*PISOS[c.piso||'drenado'].f);
  c.sAgua = R.sAgua;
}

   AYUDA CONTEXTUAL / CONTEXT HELP  (signos «?» con concepto y escala)
   c = concepto; s = escala de decisión [nivel, texto]; niveles ok · warn · bad · info
   ===================================================================== */
const E = (es,en)=>({es,en});
const AYUDA = {
  /* ---------- nutrientes / nutrients ---------- */
  NEm:{c:E('Energía neta de mantenimiento: la energía de la dieta que el animal usa para vivir sin ganar ni perder peso (respirar, digerir, regular la temperatura). Se expresa en Mcal por kg de materia seca.','Net energy for maintenance: the dietary energy the animal uses to live without gaining or losing weight (breathing, digesting, keeping warm). Expressed in Mcal per kg of dry matter.'),
    s:[['info',E('Vacas con forraje: 1.1–1.4 Mcal/kg.','Cows on forage: 1.1–1.4 Mcal/kg.')],['info',E('Desarrollo: 1.5–1.8 Mcal/kg.','Growing: 1.5–1.8 Mcal/kg.')],['ok',E('Engorda con grano: 1.95–2.25 Mcal/kg.','Grain finishing: 1.95–2.25 Mcal/kg.')],['warn',E('Más de 2.25 con poco forraje: alto riesgo de acidosis.','Above 2.25 with little forage: high acidosis risk.')]]},
  NEg:{c:E('Energía neta de ganancia: la energía de la dieta que se convierte en tejido nuevo (músculo y grasa) después de cubrir el mantenimiento. Es la que fija cuántos kilos gana el animal.','Net energy for gain: the dietary energy turned into new tissue (muscle and fat) once maintenance is covered. It sets how many kilos the animal gains.'),
    s:[['info',E('Desarrollo: 0.9–1.15 Mcal/kg.','Growing: 0.9–1.15 Mcal/kg.')],['ok',E('Finalización: 1.30–1.55 Mcal/kg.','Finishing: 1.30–1.55 Mcal/kg.')],['warn',E('Si la ENg requerida sube de 1.6, la ganancia objetivo es muy alta para ese peso y consumo.','If required NEg exceeds 1.6, the target gain is too high for that weight and intake.')]]},
  TND:{c:E('Nutrientes digestibles totales: suma de proteína, carbohidratos y 2.25 veces la grasa digestibles. Es la medida clásica de energía; de ella se estima la energía metabolizable y la síntesis de proteína microbiana.','Total digestible nutrients: digestible protein plus carbohydrates plus 2.25 times digestible fat. The classic energy measure; metabolizable energy and microbial protein synthesis are estimated from it.'),
    s:[['info',E('Forrajes 50–65 %; granos 84–93 %.','Forages 50–65 %; grains 84–93 %.')],['ok',E('Finalización 78–85 %.','Finishing 78–85 %.')]]},
  PC:{c:E('Proteína cruda = nitrógeno × 6.25. En rumiantes es solo un indicador: lo que cuenta es cuánta proteína degradan los microbios (PDR) y cuánta llega al intestino (proteína metabolizable).','Crude protein = nitrogen × 6.25. In ruminants it is only an indicator: what matters is how much the microbes degrade (RDP) and how much reaches the intestine (metabolizable protein).'),
    s:[['ok',E('Finalización 12–14 %; desarrollo 13–16 %; vacas 8–12 %.','Finishing 12–14 %; growing 13–16 %; cows 8–12 %.')],['warn',E('Más de 15 % en engorda: nitrógeno desperdiciado y contaminación.','Above 15 % in finishing: wasted nitrogen and pollution.')]]},
  PM:{c:E('Proteína metabolizable: la proteína verdadera que se absorbe en el intestino. Viene de los microbios del rumen (64 % de la proteína microbiana) y de la proteína que escapa a la degradación (80 % de la PNDR). Es la que cubre los requerimientos de mantenimiento, crecimiento, gestación y leche.','Metabolizable protein: the true protein absorbed in the intestine. It comes from rumen microbes (64 % of microbial protein) and from protein escaping degradation (80 % of RUP). It covers maintenance, growth, pregnancy and milk.'),
    s:[['ok',E('Cubrir 100–110 % del requerimiento diario.','Cover 100–110 % of the daily requirement.')],['bad',E('Bajo el mínimo: la ganancia queda limitada por proteína.','Below minimum: gain is limited by protein.')],['info',E('En becerros ligeros suele ser el primer limitante; en finalización casi nunca.','Often first-limiting in light calves; rarely in finishing.')]]},
  PDRb:{c:E('Balance de proteína degradable: la PDR de la dieta menos la que necesitan los microbios para crecer con la energía disponible (proteína cruda microbiana, PCM = 42.73 + 0.087 × TND consumido, g/d). Si es negativo, los microbios no tienen suficiente nitrógeno y la dieta rinde menos.','Degradable protein balance: dietary RDP minus what the microbes need to grow on the available energy (microbial crude protein, MCP = 42.73 + 0.087 × TDN intake, g/d). If negative, microbes lack nitrogen and the diet underperforms.'),
    s:[['ok',E('0 o ligeramente positivo.','0 or slightly positive.')],['bad',E('Negativo: agrega urea o una proteína degradable.','Negative: add urea or a degradable protein.')],['warn',E('Muy positivo (> 20 g/kg): nitrógeno que se pierde por la orina.','Very positive (> 20 g/kg): nitrogen lost in urine.')]]},
  PDR:{c:E('Proteína degradable en rumen: la parte de la proteína que los microbios desdoblan a amoniaco y péptidos para construir su propia proteína.','Rumen-degradable protein: the share of protein the microbes break down into ammonia and peptides to build their own protein.'),
    s:[['info',E('Suele ser 60–70 % de la proteína cruda en dietas de engorda.','Usually 60–70 % of crude protein in feedlot diets.')]]},
  FDN:{c:E('Fibra detergente neutro: las paredes celulares (hemicelulosa, celulosa y lignina). Llena el rumen, limita el consumo y estimula la rumia.','Neutral detergent fiber: the cell walls (hemicellulose, cellulose, lignin). Fills the rumen, limits intake and stimulates rumination.'),
    s:[['ok',E('Finalización 12–20 %; desarrollo 25–40 %; vacas 40–60 %.','Finishing 12–20 %; growing 25–40 %; cows 40–60 %.')],['warn',E('Más de 55 %: el consumo cae por llenado.','Above 55 %: intake drops by rumen fill.')]]},
  FDNef:{c:E('FDN físicamente efectiva: la fibra larga que hace rumiar al animal y producir saliva, el amortiguador natural del rumen. Es FDN × factor de efectividad del tamaño de partícula.','Physically effective NDF: the long fiber that makes the animal ruminate and produce saliva, the rumen’s natural buffer. It is NDF × the particle-size effectiveness factor.'),
    s:[['bad',E('Menos de 6 % en engorda: pH ruminal bajo, acidosis, timpanismo y abscesos hepáticos.','Below 6 % in finishing: low rumen pH, acidosis, bloat and liver abscesses.')],['ok',E('7–10 % en finalización; 12–20 % en desarrollo; ≥ 20 % en vacas.','7–10 % in finishing; 12–20 % in growing; ≥ 20 % in cows.')]]},
  For:{c:E('Porcentaje de forraje (henos, rastrojos, ensilajes y pastos) en la materia seca de la dieta.','Percentage of forage (hays, stovers, silages and grasses) in the diet dry matter.'),
    s:[['ok',E('Finalización 8–15 %; recepción 30–45 %; desarrollo 35–60 %.','Finishing 8–15 %; receiving 30–45 %; growing 35–60 %.')],['warn',E('Menos de 8 %: solo con excelente manejo del comedero.','Below 8 %: only with excellent bunk management.')]]},
  EE:{c:E('Extracto etéreo: la grasa de la dieta. Aporta mucha energía, pero en exceso cubre la fibra y daña a los microbios que la digieren.','Ether extract: dietary fat. Supplies plenty of energy, but in excess it coats fiber and harms the microbes that digest it.'),
    s:[['ok',E('3–6 %.','3–6 %.')],['warn',E('Más de 6.5–7 %: baja la digestión de la fibra y el consumo.','Above 6.5–7 %: fiber digestion and intake drop.')]]},
  Ca:{c:E('Calcio: hueso, contracción muscular y leche. El requerimiento se calcula de forma factorial: mantenimiento + crecimiento + gestación + leche, con 50 % de absorción.','Calcium: bone, muscle contraction and milk. The requirement is factorial: maintenance + growth + pregnancy + milk, with 50 % absorption.'),
    s:[['ok',E('Engorda 0.5–0.8 %; vacas 0.2–0.4 %.','Feedlot 0.5–0.8 %; cows 0.2–0.4 %.')],['warn',E('Dietas de grano son pobres en Ca: siempre lleva carbonato.','Grain diets are low in Ca: always add limestone.')]]},
  P:{c:E('Fósforo: hueso, energía celular (ATP) y fertilidad. Se absorbe ≈ 68 %. Los granos y subproductos traen de sobra; en pastoreo suele faltar.','Phosphorus: bone, cell energy (ATP) and fertility. ≈ 68 % absorbed. Grains and by-products supply plenty; on pasture it is often short.'),
    s:[['ok',E('0.20–0.35 % según la etapa.','0.20–0.35 % depending on the stage.')],['warn',E('Exceso: caro y contamina (fósforo en excretas).','Excess: costly and polluting (phosphorus in manure).')]]},
  S:{c:E('Azufre: lo usan los microbios para formar aminoácidos azufrados. En exceso produce ácido sulfhídrico en el rumen y polioencefalomalacia. Ojo con DDGS, melaza y agua con sulfatos.','Sulfur: microbes use it to make sulfur amino acids. In excess it forms hydrogen sulfide in the rumen and causes polioencephalomalacia. Watch DDGS, molasses and sulfate-rich water.'),
    s:[['ok',E('0.15–0.25 %.','0.15–0.25 %.')],['bad',E('Más de 0.30 % en dietas altas en grano (0.40 % con más de 40 % de forraje).','Above 0.30 % in high-grain diets (0.40 % with over 40 % forage).')]]},
  Na:{c:E('Sodio: regula el agua del cuerpo y el apetito. Casi solo lo aporta la sal o el bicarbonato.','Sodium: regulates body water and appetite. Supplied almost only by salt or bicarbonate.'),
    s:[['ok',E('0.06–0.10 % (≈ 0.2–0.3 % de sal).','0.06–0.10 % (≈ 0.2–0.3 % salt).')],['warn',E('Lactación: 0.10 %.','Lactation: 0.10 %.')]]},

    s:[['ok',E('Elige la etapa real del lote; para varias etapas usa el Programa (Bloque 7).','Pick the actual stage of the group; for several stages use the Program (Block 7).')]]},
  biotipo:{c:E('El biotipo cambia el gasto de mantenimiento (cebú −10 %, cruzas −5 %, lecheros +20 %; NRC, 1996), el tamaño adulto y la composición de la ganancia.','Biotype changes maintenance cost (zebu −10 %, crosses −5 %, dairy +20 %; NRC, 1996), mature size and gain composition.'),

  /* ---------- bloque 2 ---------- */
  pv:{c:E('Peso vivo promedio del lote en la etapa (lleno). El modelo usa el peso vacío en ayuno: 96 % del peso vivo.','Average live weight of the group in the stage (full). The model uses shrunk weight: 96 % of live weight.'),

  mw:{c:E('Peso adulto de la vaca con condición corporal media. Para vaquillas fija el ritmo de crecimiento hacia el empadre.','Mature cow weight at medium body condition. For heifers it sets the growth path to breeding.'),

  dmi:{c:E('Consumo de materia seca por animal por día. RatioBos lo predice con NRC (1996) y NASEM (2016) a partir del peso y la ENm de la dieta, y lo ajusta por raza, engrasamiento, implante, ionóforo, temperatura y lodo.','Dry matter intake per head per day. RatioBos predicts it with NRC (1996) and NASEM (2016) from weight and dietary NEm, and adjusts it for breed, fatness, implant, ionophore, temperature and mud.'),

  diasGest:{c:E('Días de gestación. Las necesidades del feto crecen exponencialmente: en el último tercio (> 190 d) se suman energía, proteína, calcio y fósforo.','Days of pregnancy. Fetal needs grow exponentially: in the last trimester (> 190 d) energy, protein, calcium and phosphorus are added.'),

  grasaL:{c:E('Grasa de la leche (%). Determina su contenido de energía.','Milk fat (%). Determines its energy content.'), s:[['info',E('Ganado de carne: 3.5–4.5 %.','Beef cattle: 3.5–4.5 %.')]]},
  protL:{c:E('Proteína de la leche (%).','Milk protein (%).'), s:[['info',E('Ganado de carne: 3.2–3.6 %.','Beef cattle: 3.2–3.6 %.')]]},
  nemSup:{c:E('ENm de la dieta con la que se calcularon los valores de esta tabla. Al formular, RatioBos la ajusta sola hasta que coincide con la de la dieta obtenida.','Dietary NEm used to compute the values in this table. When formulating, RatioBos adjusts it automatically until it matches the resulting diet.'),

  implante:{c:E('Los implantes anabólicos aumentan la ganancia y el consumo. Sin implante el consumo esperado es 6 % menor (NRC, 1996).','Anabolic implants increase gain and intake. Without an implant expected intake is 6 % lower (NRC, 1996).'),

  cabezas:{c:E('Número de animales del corral o lote; sirve para calcular el alimento diario total.','Number of animals in the pen or group; used to compute total daily feed.'), s:[['info',E('Resta la mortalidad esperada.','Subtract expected deaths.')]]},

  compra:{c:E('Precio de compra por kg de peso vivo del animal que entra al corral.','Purchase price per kg live weight of the animal entering the pen.'), s:[['info',E('Úsalo para el punto de equilibrio del Programa.','Used for the Program break-even.')]]},
  venta:{c:E('Precio de venta por kg de peso vivo al salir del corral.','Sale price per kg live weight when leaving the pen.'), s:[['info',E('Si es menor que el de compra, la ganancia de peso debe pagar el diferencial.','If lower than the purchase price, weight gain must pay for the spread.')]]},
  otrosDia:{c:E('Costos distintos del alimento por animal por día: mano de obra, sanidad, intereses, instalaciones.','Non-feed costs per head per day: labor, health, interest, facilities.'), s:[['info',E('En México suelen ser 15–25 % del costo diario total.','In Mexico they are usually 15–25 % of total daily cost.')]]},

  pMcal:{c:E('Costo de 1 Mcal de ENg aportada por el ingrediente. Compara fuentes de energía para engorda.','Cost of 1 Mcal of NEg supplied by the ingredient. Compares energy sources for finishing.'), s:[['ok',E('El más bajo es tu energía más barata.','The lowest is your cheapest energy.')]]},
  ppc:{c:E('Costo de 1 kg de proteína cruda aportada por el ingrediente (base seca).','Cost of 1 kg of crude protein supplied by the ingredient (dry basis).'), s:[['ok',E('Compara junto con su degradabilidad: no es lo mismo urea que harina de pescado.','Compare along with degradability: urea is not the same as fish meal.')]]},
  base:{c:E('Materia seca (MS): la fórmula nutricional. Tal como se ofrece (TCO, base húmeda): lo que pesas en la báscula y compras.','Dry matter (DM): the nutritional formula. As fed (wet basis): what you weigh on the scale and buy.'),
    s:[['info',E('Cambia la vista con el selector MS / TCO.','Switch the view with the DM / AF selector.')]]},

  /* ---------- bloque 6 ---------- */
  cert:{c:E('Certificado de optimalidad: por dualidad fuerte, el costo de la fórmula (primal) debe igualar el valor dual. La brecha y la violación miden el error numérico.','Optimality certificate: by strong duality, the formula cost (primal) must equal the dual value. The gap and violation measure numerical error.'),
    s:[['ok',E('Menores a 1×10⁻⁶: óptimo garantizado.','Below 1×10⁻⁶: guaranteed optimum.')]]},
  iter:{c:E('Ajuste iterativo: la ENg que necesita la dieta depende de su propia ENm (alimento que se va en mantenimiento) y el consumo también. RatioBos resuelve, actualiza la ENm y vuelve a resolver hasta que coinciden (cambio < 0.002 Mcal/kg).','Iterative adjustment: the NEg the diet needs depends on its own NEm (feed spent on maintenance), and so does intake. RatioBos solves, updates NEm and solves again until they agree (change < 0.002 Mcal/kg).'),
    s:[['ok',E('Converge en 2–6 vueltas.','Converges in 2–6 rounds.')],['warn',E('Si no converge, la meta de ganancia está en el límite de lo posible.','If it does not converge, the gain target is at the edge of feasibility.')]]},
  costoMS:{c:E('Costo por kg de materia seca de la dieta; es lo que el modelo hace mínimo.','Diet cost per kg of dry matter; it is what the model minimizes.'), s:[['info',E('Compara dietas mejor por costo por kg de ganancia.','Compare diets better by cost per kg of gain.')]]},
  costoTCO:{c:E('Costo por kg o tonelada de la mezcla tal como se ofrece (húmeda).','Cost per kg or tonne of the mix as fed (wet).'), s:[['info',E('Es el precio que verías si compraras la ración hecha.','It is the price you would see if you bought the mixed ration.')]]},
  costoDia:{c:E('Costo de alimento por animal por día = consumo de MS × costo por kg de MS.','Feed cost per head per day = DM intake × cost per kg DM.'), s:[['info',E('Multiplica por los días en corral para el costo total.','Multiply by days on feed for the total cost.')]]},
  costoKgGan:{c:E('Costo de alimento por kg de peso ganado = costo diario ÷ ganancia diaria. Es el criterio económico más importante de la engorda.','Feed cost per kg of weight gained = daily cost ÷ daily gain. The most important economic criterion in the feedlot.'),
    s:[['ok',E('Debe ser menor que el precio de venta por kg.','It must be lower than the sale price per kg.')],['warn',E('Una dieta más cara por tonelada puede ganar aquí.','A diet costlier per tonne can win here.')]]},
  adgPred:{c:E('Ganancia diaria que permite la dieta formulada con el consumo esperado: la menor entre la que permite la energía (EM) y la que permite la proteína metabolizable (PM).','Daily gain allowed by the formulated diet at the expected intake: the lower of energy-allowable and metabolizable-protein-allowable gain.'),
    s:[['ok',E('Igual o un poco mayor que tu meta.','Equal to or slightly above your target.')],['info',E('Si la limita la proteína, revisa la PM y el balance de PDR.','If protein limits it, check MP and RDP balance.')]]},
  conv:{c:E('Conversión alimenticia: kg de materia seca consumida por kg de peso ganado. Menos es mejor.','Feed conversion: kg of dry matter eaten per kg of weight gained. Lower is better.'),
    s:[['ok',E('Finalización 5.5–7; desarrollo 6–9.','Finishing 5.5–7; growing 6–9.')]]},
  balE:{c:E('Balance de energía: lo que aporta la dieta menos lo que el animal necesita. En vacas, un balance negativo significa que pierde peso y condición corporal.','Energy balance: what the diet supplies minus what the animal needs. In cows a negative balance means weight and body-condition loss.'),
    s:[['ok',E('Cercano a cero o positivo.','Near zero or positive.')],['bad',E('Negativo en el último tercio o la lactación: baja la preñez siguiente.','Negative in late gestation or lactation: next pregnancy rate falls.')]]},
  balPM:{c:E('Balance de proteína metabolizable diario: aporte menos requerimiento.','Daily metabolizable-protein balance: supply minus requirement.'), s:[['ok',E('0 a +10 %.','0 to +10 %.')],['bad',E('Negativo: la proteína limita la ganancia o la leche.','Negative: protein limits gain or milk.')]]},
  ch4:{c:E('Metano entérico estimado con el método IPCC (2019, Nivel 2): energía bruta consumida × Ym. Ym va de 3 % (engorda con más de 90 % de concentrado) a 7 % (forraje de baja calidad).','Enteric methane estimated with the IPCC (2019, Tier 2) method: gross energy intake × Ym. Ym ranges from 3 % (feedlot >90 % concentrate) to 7 % (low-quality forage).'),
    s:[['info',E('Dietas más digestibles producen menos metano por kg de carne.','More digestible diets produce less methane per kg of beef.')],['ok',E('Engorda: 15–25 g de CH₄ por kg de ganancia.','Feedlot: 15–25 g CH₄ per kg of gain.')]]},
  nExc:{c:E('Nitrógeno excretado = nitrógeno consumido − retenido en la ganancia, el feto o la leche. Es la base del impacto ambiental del corral (amoniaco, nitratos).','Excreted nitrogen = nitrogen eaten − retained in gain, fetus or milk. The basis of the pen’s environmental footprint (ammonia, nitrates).'),
    s:[['ok',E('Ajustar la proteína al requerimiento reduce la excreción.','Matching protein to requirements cuts excretion.')]]},
  marg:{c:E('Precio sombra: cuánto cambia el costo por tonelada de MS si el requerimiento sube 1 %. Viene de la solución dual del modelo.','Shadow price: how much the cost per tonne of DM changes if the requirement rises 1 %. Comes from the dual solution.'),
    s:[['info',E('Cero: ese nutriente sale gratis.','Zero: that nutrient comes free.')],['warn',E('Alto: ese requerimiento es caro; confirma que esté justificado.','High: that requirement is expensive; make sure it is justified.')]]},
  estado:{c:E('Una restricción limitante (activa) es la que fija el costo: el nutriente quedó justo en su mínimo o máximo.','A binding (active) constraint sets the cost: the nutrient sits exactly at its minimum or maximum.'), s:[['info',E('Revísalas primero.','Review them first.')]]},
  cumpl:{c:E('Aporte de la dieta como % del requerimiento mínimo. La línea vertical marca el 100 %.','Diet supply as % of the minimum requirement. The vertical line marks 100 %.'), s:[['ok',E('100–110 %: ajustado.','100–110 %: tight.')],['warn',E('Más de 115 %: exceso (barra terracota).','Above 115 %: excess (terracotta bar).')]]},
  CaP:{c:E('Relación calcio : fósforo. Con dietas de grano el fósforo sobra y hay que subir el calcio para evitar cálculos urinarios.','Calcium : phosphorus ratio. Grain diets carry surplus P, so Ca must rise to prevent urinary calculi.'), s:[['ok',E('1.5–2.5 : 1.','1.5–2.5 : 1.')],['bad',E('Menos de 1.2 : 1: riesgo de urolitiasis en machos.','Below 1.2 : 1: urolithiasis risk in males.')]]},
  forcon:{c:E('Relación forraje : concentrado en la materia seca.','Forage : concentrate ratio in dry matter.'), s:[['info',E('Finalización 10:90; desarrollo 40:60 a 60:40.','Finishing 10:90; growing 40:60 to 60:40.')]]},
  acidosis:{c:E('Semáforo de salud ruminal: combina fibra efectiva, forraje, grasa, urea y azufre para anticipar acidosis, timpanismo, intoxicación por amoniaco y polioencefalomalacia.','Rumen-health traffic light: combines effective fiber, forage, fat, urea and sulfur to anticipate acidosis, bloat, ammonia toxicity and polioencephalomalacia.'),
    s:[['ok',E('Verde: dentro de rangos seguros.','Green: within safe ranges.')],['warn',E('Ámbar: vigila el comedero y las heces.','Amber: watch the bunk and manure.')],['bad',E('Rojo: corrige antes de ofrecer la dieta.','Red: fix before feeding the diet.')]]},
  entrada:{c:E('Precio de entrada: el precio (por kg tal como se ofrece) al que un ingrediente no usado empezaría a entrar a la fórmula.','Entry price: the price (per kg as fed) at which an unused ingredient would start entering the formula.'),
    s:[['ok',E('Si tu proveedor te lo da a ese precio o menos, vuelve a formular.','If your supplier offers it at that price or lower, reformulate.')]]},
  limEf:{c:E('Efecto en el costo por tonelada de MS de mover un límite de inclusión 1 punto porcentual.','Effect on cost per tonne of DM of moving an inclusion limit by one percentage point.'), s:[['warn',E('Negativo: relajar ese límite abarata la dieta.','Negative: relaxing that limit makes the diet cheaper.')]]},
  evaluar:{c:E('Compara una fórmula que ya usas (en % de MS) contra los requerimientos y la fórmula óptima.','Compares a formula you already use (in % of DM) against the requirements and the optimal formula.'), s:[['info',E('La diferencia × toneladas al año = ahorro posible.','The difference × tonnes per year = possible savings.')]]},

  /* ---------- bloque 7 ---------- */
  dof:{c:E('Días en corral: los que tarda el animal en ir del peso de entrada al de venta con las dietas del programa, simulando el crecimiento día a día.','Days on feed: how long the animal takes from entry to sale weight with the program diets, simulating growth day by day.'), s:[['info',E('Engorda típica: 90–150 días.','Typical feedlot: 90–150 days.')]]},
  equilibrio:{c:E('Precio de venta de equilibrio: el precio por kg al que la venta apenas paga la compra del animal, el alimento y los otros costos.','Break-even sale price: the price per kg at which the sale just covers the animal purchase, feed and other costs.'),
    s:[['ok',E('Si tu precio de venta es mayor, el lote deja utilidad.','If your sale price is higher, the group is profitable.')]]},
  margen:{c:E('Utilidad por cabeza = venta − compra − alimento − otros costos.','Profit per head = sale − purchase − feed − other costs.'), s:[['info',E('Sin incluir mortalidad ni impuestos.','Excluding deaths and taxes.')]]},
  costoVaca:{c:E('Costo de alimento por vaca al año, sumando las cuatro etapas del ciclo.','Feed cost per cow per year, adding the four stages of the cycle.'), s:[['info',E('Divídelo entre los kg de becerro destetado para el costo por kg de becerro.','Divide by kg of weaned calf for cost per kg of calf.')]]},

  /* ---------- validación ---------- */
  mape:{c:E('Error absoluto medio porcentual (MAPE) entre el análisis calculado que publica cada artículo y el que calcula la app con su propia matriz de ingredientes.','Mean absolute percentage error (MAPE) between the calculated analysis each paper reports and the one the app computes with its own ingredient matrix.'),
    s:[['ok',E('Menos de 3 %: concordancia excelente.','Below 3 %: excellent agreement.')],['info',E('3–8 %: aceptable; se explica por diferencias de tabla de ingredientes.','3–8 %: acceptable; explained by feed-table differences.')]]},
  reform:{c:E('Prueba del optimizador: se pide la dieta más barata con al menos el mismo aporte que la fórmula publicada. Debe dar una igual o más barata.','Optimizer test: ask for the cheapest diet supplying at least as much as the published formula. It must return one that is equal or cheaper.'),
    s:[['ok',E('Igual o más barata: el optimizador es correcto.','Equal or cheaper: the optimizer is correct.')]]},
  eneObs:{c:E('Energía neta observada (Zinn y Shen, 1998): a partir del peso, la ganancia y el consumo medidos se despeja la ENm de la dieta. RatioBos repite el cálculo con los datos de cada artículo y lo compara con el valor publicado.','Observed net energy (Zinn and Shen, 1998): dietary NEm is solved from measured weight, gain and intake. RatioBos repeats the calculation with each paper’s data and compares it with the published value.'),
    s:[['ok',E('Diferencias menores a 2 %: el método está bien implementado.','Differences below 2 %: the method is correctly implemented.')]]},
  predADG:{c:E('Ganancia que predice RatioBos con la dieta publicada, el consumo observado y los valores de tabla, comparada con la ganancia medida.','Gain predicted by RatioBos from the published diet, observed intake and table values, compared with measured gain.'),
    s:[['info',E('Diferencias de ±10 % son normales: la energía real de una dieta cambia con el procesamiento del grano y el manejo.','Differences of ±10 % are normal: a diet’s real energy changes with grain processing and management.')]]},

  /* ---------- región e infraestructura ---------- */
  ith:{c:E('Índice de temperatura y humedad: ITH = 0.81·T + (HR/100)·(T − 14.4) + 46.4. Resume el calor que siente el animal; la humedad lo agrava porque impide enfriarse sudando y jadeando.','Temperature–humidity index: THI = 0.81·T + (RH/100)·(T − 14.4) + 46.4. Summarizes the heat the animal feels; humidity worsens it by hindering cooling through sweating and panting.'),
    s:[['ok',E('Menos de 75: normal.','Below 75: normal.')],['info',E('75–78: alerta.','75–78: alert.')],['warn',E('79–83: peligro; jadeo rápido.','79–83: danger; rapid panting.')],['bad',E('84 o más: emergencia.','84 or more: emergency.')]]},
  sombra:{c:E('La sombra corta la radiación solar, que puede sumar el equivalente a varios grados de temperatura. Más área por animal y estructuras altas y ventiladas alivian más.','Shade blocks solar radiation, which can add the equivalent of several degrees. More area per head and tall, ventilated structures relieve more.'),
    s:[['warn',E('Lámina de 1.3 m² por animal: alivio pequeño.','1.3 m² sheet metal per head: small relief.')],['ok',E('2.5–4 m² por animal o domo con ventiladores: recomendable en clima cálido.','2.5–4 m² per head or a dome with fans: recommended in hot climates.')]]},
  piso:{c:E('El lodo hace que el animal gaste energía al moverse, ensucia el pelo (pierde aislamiento) y baja el consumo ≈ 1 % por cm.','Mud makes animals spend energy moving, dirties the coat (losing insulation) and cuts intake ≈ 1 % per cm.'),
    s:[['ok',E('Piso firme o tierra con pendiente y montículos.','Firm floor or sloped dirt with mounds.')],['bad',E('Tierra sin drenaje en lluvias: lodo de 10–15 cm.','Undrained dirt in the rains: 10–15 cm of mud.')]]},
  sistemaP:{c:E('En pastoreo el animal camina y busca su alimento: el mantenimiento sube 10 % en terreno plano y 20 % en lomerío (NRC, 1996).','On pasture the animal walks and forages: maintenance rises 10 % on flat land and 20 % on hills (NRC, 1996).'),
    s:[['info',E('En corral el gasto de actividad es mínimo.','In a pen the activity cost is minimal.')]]},
  sAgua:{c:E('Sulfatos del agua de bebida (mg/L). Su azufre se suma al de la ración; la app descuenta ese aporte del máximo de azufre permitido.','Drinking-water sulfates (mg/L). Their sulfur adds to the ration’s; the app subtracts it from the maximum sulfur allowed.'),
    s:[['ok',E('Menos de 500 mg/L.','Below 500 mg/L.')],['warn',E('500–1,000 mg/L: limita DDGS y melaza.','500–1,000 mg/L: limit DDGS and molasses.')],['bad',E('Más de 1,000 mg/L: riesgo de polioencefalomalacia.','Over 1,000 mg/L: polioencephalomalacia risk.')]]},
  regionComp:{c:E('El mismo animal y la misma lista de ingredientes formulados con el clima de la temporada y los precios estimados de cada región.','The same animal and ingredient list formulated with each region’s seasonal climate and estimated prices.'),
    s:[['info',E('La barra terracota es tu región.','The terracotta bar is your region.')]]},

  /* ---------- tablero ---------- */
  ea:{c:E('Eficiencia alimenticia = kg ganados ÷ kg de materia seca consumida. Más alto es mejor.','Feed efficiency = kg gained ÷ kg of dry matter eaten. Higher is better.'),
    s:[['ok',E('Finalización 0.14–0.19; becerros 0.20–0.28.','Finishing 0.14–0.19; calves 0.20–0.28.')]]},
  bc:{c:E('Relación beneficio : costo = ingresos ÷ costos. Mayor que 1: la actividad deja utilidad.','Benefit : cost ratio = revenue ÷ costs. Above 1: the activity is profitable.'),
    s:[['ok',E('Mayor que 1.1.','Above 1.1.')],['warn',E('Entre 1.0 y 1.1: margen estrecho.','Between 1.0 and 1.1: thin margin.')],['bad',E('Menor que 1: pérdidas.','Below 1: losses.')]]},
  optimo:{c:E('La app formula raciones para varias metas de ganancia y calcula el margen diario de cada una (valor de la ganancia − alimento − otros costos). El punto más alto es la ganancia económicamente óptima.','The app formulates rations for several gain targets and computes each one’s daily margin (value of gain − feed − other costs). The highest point is the economically optimal gain.'),
    s:[['info',E('Depende de tus precios: si sube el grano, el óptimo baja.','It depends on your prices: if grain rises, the optimum falls.')]]},
  sensib:{c:E('Cómo cambian el costo y el uso del ingrediente que más pesa en la ración cuando su precio sube o baja hasta 30 %.','How cost and use of the ration’s heaviest ingredient change when its price moves up or down by up to 30 %.'),
    s:[['info',E('Una curva plana indica que hay buenos sustitutos.','A flat curve means there are good substitutes.')]]},
  refs:{c:E('Desempeño medido en engordas experimentales y comerciales publicadas, como referencia para tus resultados.','Performance measured in published experimental and commercial feedlots, as a benchmark for your results.'),
    s:[['info',E('Compara animales de peso y biotipo parecidos.','Compare animals of similar weight and biotype.')]]},

  /* ---------- sostenibilidad ---------- */
  sostenible:{c:E('Semáforo de la carga ambiental de la ración, en el sentido de sostenibilidad de la FAO: producir con menos recursos y menos externalidades negativas.','Traffic light for the ration’s environmental load, in FAO’s sense of sustainability: producing with fewer resources and fewer negative externalities.'),
    s:[['ok',E('Verde: carga baja para este tipo de producción.','Green: low load for this type of production.')],['warn',E('Ámbar: hay margen para mejorar.','Amber: room for improvement.')],['bad',E('Rojo: prioridad de mejora.','Red: improvement priority.')]]},
  gei:{c:E('Gases de efecto invernadero en CO₂ equivalente (IPCC AR6: CH₄ × 27, N₂O × 273): metano entérico y del estiércol, óxido nitroso del estiércol y emisiones de producir el alimento.','Greenhouse gases in CO₂ equivalents (IPCC AR6: CH₄ × 27, N₂O × 273): enteric and manure methane, manure nitrous oxide and feed-production emissions.'),
    s:[['ok',E('Engorda intensiva: ≈ 8–15 kg CO₂e por kg ganado.','Intensive feedlot: ≈ 8–15 kg CO₂e per kg gained.')],['warn',E('Raciones de forraje de baja calidad emiten más por kg de carne.','Low-quality forage rations emit more per kg of beef.')]]},
  aguaB:{c:E('Agua que bebe el animal: ≈ 3.5 L por kg de MS en clima templado y ≈ 5 L en calor.','Water the animal drinks: ≈ 3.5 L per kg DM in temperate climates and ≈ 5 L in heat.'), s:[['info',E('Sube mucho con calor y con dietas saladas.','Rises sharply with heat and salty diets.')]]},
  huellaH:{c:E('Huella hídrica verde (lluvia) + azul (riego) para producir el alimento consumido (Mekonnen y Hoekstra, 2011).','Green (rain) + blue (irrigation) water footprint to produce the feed eaten (Mekonnen and Hoekstra, 2011).'), s:[['info',E('Los subproductos y forrajes de temporal tienen huella azul baja.','By-products and rainfed forages have a low blue footprint.')]]},
  sueloA:{c:E('Superficie agrícola necesaria para producir el alimento del animal durante un año, con rendimientos medios.','Cropland needed to produce the animal’s feed for a year, at average yields.'), s:[['info',E('Los subproductos usan poca tierra propia.','By-products use little land of their own.')]]},
  sueloE:{c:E('Superficie para aplicar el estiércol sin contaminar: 170 kg de N o 25 kg de P por hectárea al año; se toma la mayor.','Land to spread manure without pollution: 170 kg N or 25 kg P per hectare per year; the larger applies.'), s:[['warn',E('Si no tienes esa superficie, composta o vende el estiércol.','If you lack that land, compost or sell the manure.')]]},
  nh3:{c:E('Amoniaco que se volatiliza de las excretas (30 % del N en corral, 21 % en pastoreo; IPCC, 2019). Causa olores, partículas finas y lluvia ácida.','Ammonia volatilized from excreta (30 % of N in drylots, 21 % on pasture; IPCC, 2019). Causes odor, fine particles and acid rain.'), s:[['ok',E('Ajustar la proteína al requerimiento lo reduce.','Matching protein to requirements reduces it.')]]},
  agGris:{c:E('Nitrógeno que se lava a los mantos de agua en climas húmedos y volumen de agua que se necesitaría para diluirlo a 10 mg/L (agua gris).','Nitrogen leached to groundwater in humid climates and the volume of water needed to dilute it to 10 mg/L (grey water).'), s:[['info',E('En climas secos la lixiviación es mínima.','In dry climates leaching is minimal.')]]},
  pExc:{c:E('Fósforo de la ración que no retiene el animal. En el suelo se acumula y en el agua causa eutrofización.','Ration phosphorus the animal does not retain. It builds up in soil and causes eutrophication in water.'), s:[['ok',E('No pases el requerimiento de P más de 10–15 %.','Do not exceed the P requirement by more than 10–15 %.')]]},
  heces:{c:E('Heces frescas estimadas (15 % de MS) a partir de la materia seca no digerida.','Estimated fresh feces (15 % DM) from undigested dry matter.'), s:[['info',E('Sin contar la orina.','Excluding urine.')]]},
  medic:{c:E('Medicamentos y aditivos por animal y por lote, clasificados por categoría y, para los antimicrobianos, por su importancia en la medicina humana según la OMS.','Medicines and additives per head and per group, classified by category and, for antimicrobials, by their importance in human medicine according to WHO.'),
    s:[['ok',E('Ionóforos y vacunas: sin importancia médica / preventivos.','Ionophores and vaccines: not medically important / preventive.')],['bad',E('Macrólidos: uso solo justificado por el veterinario.','Macrolides: use only when justified by the veterinarian.')]]},
  precioC:{c:E('Precio interno del carbono: un costo ficticio por tonelada de CO₂e que se suma al precio de cada ingrediente. Al subirlo, el modelo cambia a ingredientes con menor huella; la curva muestra cuánto cuesta reducirla.','Internal carbon price: a shadow cost per tonne of CO₂e added to each ingredient’s price. As it rises, the model shifts to lower-footprint ingredients; the curve shows what reducing it costs.'),
    s:[['info',E('El punto de equilibrio es donde cada peso extra evita más CO₂e.','The balance point is where each extra peso avoids the most CO₂e.')]]},
  valEco:{c:E('Con el consumo, los días, el precio del alimento, los otros costos y el precio del ganado que publica el artículo, RatioBos recalcula el costo total, el ingreso, el costo por kg ganado y la relación beneficio : costo.','From the intake, days, feed price, other costs and cattle price the paper publishes, RatioBos recomputes total cost, income, cost per kg gained and the benefit : cost ratio.'),
    s:[['ok',E('Diferencias menores a 1 %: las fórmulas económicas son correctas.','Differences below 1 %: the economic formulas are correct.')]]},
  valPM:{c:E('Porcentaje del requerimiento de proteína metabolizable que cubría cada ración según los autores (NRC, 2000) y según RatioBos (NASEM, 2016), con la ganancia y el consumo medidos.','Percentage of the metabolizable-protein requirement each ration covered according to the authors (NRC, 2000) and to RatioBos (NASEM, 2016), at measured gain and intake.'),
    s:[['info',E('NASEM (2016) estima menos proteína microbiana que NRC (2000): es normal que RatioBos dé valores algo menores.','NASEM (2016) estimates less microbial protein than NRC (2000): somewhat lower values from RatioBos are expected.')]]},
  huellaIng:{c:E('Factores ambientales por kg de MS del ingrediente: emisiones de producirlo, huella hídrica y superficie. Valores orientativos; reemplázalos si tienes datos de tu proveedor.','Environmental factors per kg DM of the ingredient: production emissions, water footprint and land. Indicative values; replace them if your supplier has data.'), s:[['info',E('Se usan en el Bloque 10.','Used in Block 10.')]]}
};
/* botón «?» */
function ayuda(k){ return AYUDA[k] ? `<span class="qh" tabindex="0" role="button" data-q="${k}" aria-label="${T('Ayuda','Help')}">?</span>` : ''; }
function ayudaHTML(k, titulo){
  const a = AYUDA[k]; if(!a) return '';
  return `${titulo?`<b class="qt">${titulo}</b>`:''}<p>${tx(a.c)}</p><div class="qe">${T('Escala de decisión','Decision scale')}</div><ul>${a.s.map(([n,t])=>`<li class="${n}">${tx(t)}</li>`).join('')}</ul>`;
}
(function(){
  let tip=null, cur=null;
  function show(el){
    if(!tip){ tip=document.createElement('div'); tip.id='qtip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
    const k=el.dataset.q; const tit = el.dataset.qt || (el.closest('td,th,label,h3,h4,.kpi .l,.l,.f')||{}).innerText || '';
    tip.innerHTML = ayudaHTML(k, (NUT[k]?tx(NUT[k].n):tit.replace(/\?/g,'').trim()).slice(0,90)); cur=el;
